<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PrintVault — 3D Print Library Manager</title>
<meta name="description" content="Local-first 3D print file manager. Index your STL/3MF/gcode folders, tag and search models, track print history, find duplicates, and manage filament. No accounts, no uploads, no tracking.">
<meta name="author" content="magikh0e">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23ff8a3d' d='M16 2 3 9v14l13 7 13-7V9zm0 3.3 9.4 5.1L16 15.5 6.6 10.4zM5.5 12.5 15 17.6v9.1l-9.5-5.1zm11.5 14.2v-9.1l9.5-5.1v9.1z'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0e1014; --bg2:#151920; --bg3:#1c212b; --bg4:#242b38;
  --line:#2a313d; --line2:#3a4453;
  --txt:#e7eaf0; --dim:#8d97a8; --dim2:#69738a;
  --acc:#ff8a3d; --accd:#c9662a; --acc-soft:rgba(255,138,61,.13);
  --ok:#3ddc97; --warn:#ffd166; --bad:#ff6060; --info:#5aa9ff;
  --r:10px; --r2:14px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
}
html[data-theme=light]{
  --bg:#f6f7f9; --bg2:#fff; --bg3:#f0f2f5; --bg4:#e4e8ee;
  --line:#dde2e9; --line2:#c6cdd8;
  --txt:#151a21; --dim:#5f6b7d; --dim2:#8a94a4;
  --acc:#e06a15; --accd:#b8540c; --acc-soft:rgba(224,106,21,.1);
  --sh:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
::selection{background:var(--acc-soft);color:var(--txt)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--dim2)}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:16px;height:16px;flex:0 0 auto}   /* fallback size; every specific rule below wins */
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
code,kbd,.mono{font-family:var(--mono);font-size:.92em}

/* ---------- layout ---------- */
.pv-app{display:flex;flex-direction:column;height:100dvh}
.pv-top{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto;position:relative;z-index:30}
.pv-brand{display:flex;align-items:center;gap:9px;font-weight:750;letter-spacing:-.02em;font-size:15px;white-space:nowrap;user-select:none}
.pv-brand svg{width:22px;height:22px;flex:0 0 auto}
.pv-brand span i{font-style:normal;color:var(--acc)}
.pv-ver{font:600 10px/1 var(--mono);color:var(--dim2);background:var(--bg3);border:1px solid var(--line);padding:3px 5px;border-radius:5px}

.pv-search{flex:1;max-width:520px;position:relative;display:flex;align-items:center}
.pv-search svg{position:absolute;left:10px;width:15px;height:15px;color:var(--dim2);pointer-events:none}
.pv-search input{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 30px 8px 32px;outline:none}
.pv-search input:focus{border-color:var(--acc);background:var(--bg)}
.pv-search kbd{position:absolute;right:8px;font:600 10px/1 var(--mono);color:var(--dim2);background:var(--bg4);border:1px solid var(--line);padding:3px 5px;border-radius:4px}
.pv-search input:focus + kbd{display:none}

.pv-top .sp{flex:1}
.pv-tabs{display:flex;gap:2px;padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
.pv-tabs::-webkit-scrollbar{display:none}
.pv-tab{display:flex;align-items:center;gap:7px;background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;color:var(--dim);cursor:pointer;white-space:nowrap;font-weight:550;transition:color .12s}
.pv-tab svg{width:15px;height:15px}
.pv-tab:hover{color:var(--txt)}
.pv-tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.pv-tab .ct{font:600 10px/1 var(--mono);background:var(--bg4);color:var(--dim);padding:3px 5px;border-radius:20px;min-width:18px;text-align:center}
.pv-tab.on .ct{background:var(--acc-soft);color:var(--acc)}

.pv-body{flex:1;display:flex;min-height:0}
.pv-side{width:232px;flex:0 0 auto;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:10px 0 40px}
.pv-side.hide{display:none}
.pv-main{flex:1;overflow-y:auto;padding:16px 18px 60px;min-width:0}
.pv-view{display:none}
.pv-view.on{display:block}

/* ---------- sidebar ---------- */
.pv-sg{margin-bottom:6px}
.pv-sh{display:flex;align-items:center;gap:6px;padding:7px 14px 5px;font:650 10.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--dim2)}
.pv-sh button{margin-left:auto;background:none;border:0;color:var(--dim2);cursor:pointer;padding:2px;display:flex;border-radius:4px}
.pv-sh button:hover{color:var(--acc);background:var(--bg4)}
.pv-sh svg{width:13px;height:13px}
.pv-si{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:6px 14px;color:var(--dim);cursor:pointer;text-align:left;font-size:13px;border-left:2px solid transparent}
.pv-si:hover{background:var(--bg3);color:var(--txt)}
.pv-si.on{background:var(--acc-soft);color:var(--acc);border-left-color:var(--acc);font-weight:600}
.pv-si svg{width:14px;height:14px;flex:0 0 auto;opacity:.85}
.pv-si .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-si .c{font:600 10px/1 var(--mono);color:var(--dim2)}
.pv-si .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.pv-root{position:relative}
.pv-root .x{opacity:0;background:none;border:0;color:var(--dim2);cursor:pointer;padding:2px;display:flex}
.pv-root:hover .x{opacity:1}
.pv-root .x:hover{color:var(--bad)}

/* ---------- buttons ---------- */
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--bg3);border:1px solid var(--line);color:var(--txt);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:550;white-space:nowrap;transition:background .12s,border-color .12s,transform .06s}
.b:hover{background:var(--bg4);border-color:var(--line2)}
.b:active{transform:translateY(1px)}
.b:disabled{opacity:.45;cursor:not-allowed;transform:none}
.b svg{width:15px;height:15px}
.b.p{background:var(--acc);border-color:var(--acc);color:#1a0d03;font-weight:650}
.b.p:hover{background:var(--acc2,#ffa05e);border-color:var(--acc2,#ffa05e)}
.b.g{background:none;border-color:transparent;color:var(--dim);padding:6px 8px}
.b.g:hover{background:var(--bg3);color:var(--txt)}
.b.d{border-color:transparent;color:var(--bad)}
.b.d:hover{background:rgba(255,96,96,.12);border-color:rgba(255,96,96,.3)}
.b.sm{padding:5px 9px;font-size:12.5px;border-radius:7px}
.b.sm svg{width:13px;height:13px}
.b.ico{padding:7px;border-radius:8px}
.seg{display:flex;background:var(--bg3);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 10px;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12.5px}
.seg button:hover{color:var(--txt);background:var(--bg4)}
.seg button.on{background:var(--acc-soft);color:var(--acc)}
.seg button svg{width:14px;height:14px}

/* ---------- forms ---------- */
.f{display:block;margin-bottom:12px}
.f>label{display:block;font-size:11.5px;font-weight:600;color:var(--dim);margin-bottom:5px;letter-spacing:.02em}
.f input,.f select,.f textarea{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--acc);background:var(--bg)}
.f textarea{resize:vertical;min-height:70px;font-family:inherit}
.f .hint{font-size:11.5px;color:var(--dim2);margin-top:4px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
input[type=color]{padding:2px;height:36px;cursor:pointer}
input[type=checkbox]{width:auto;accent-color:var(--acc);cursor:pointer}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;padding:4px 0}

/* ---------- toolbar ---------- */
.pv-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.pv-bar h2{font-size:19px;margin-right:2px}
.pv-bar .sp{flex:1}
.pv-bar .cnt{color:var(--dim2);font:500 12.5px/1 var(--mono)}

/* ---------- model grid ---------- */
.pv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:13px}
.pv-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .13s,transform .13s,box-shadow .13s;position:relative}
.pv-card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--sh)}
.pv-card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.pv-thumb{aspect-ratio:4/3;background:var(--bg3);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pv-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pv-thumb .ph{color:var(--dim2);opacity:.35}
.pv-thumb .ph svg{width:44px;height:44px}
.pv-thumb .badges{position:absolute;top:6px;left:6px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 12px)}
.pv-thumb .fav{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);border:0;border-radius:7px;padding:5px;cursor:pointer;color:#fff;display:flex;opacity:0;transition:opacity .13s}
.pv-card:hover .fav,.pv-thumb .fav.on{opacity:1}
.pv-thumb .fav.on{color:var(--warn)}
.pv-thumb .fav svg{width:14px;height:14px}
.bdg{font:650 9.5px/1 var(--mono);letter-spacing:.04em;padding:4px 5px;border-radius:5px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#dfe4ec;text-transform:uppercase}
.bdg.ok{background:rgba(61,220,151,.9);color:#052a1b}
.bdg.acc{background:rgba(255,138,61,.92);color:#26120a}
.bdg.bad{background:rgba(255,96,96,.9);color:#2b0707}
.pv-meta{padding:9px 10px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.pv-meta .t{font-weight:600;font-size:13px;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.pv-meta .s{font:500 11px/1 var(--mono);color:var(--dim2);display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}
.pv-tags{display:flex;gap:4px;flex-wrap:wrap}
.tg{font-size:10.5px;font-weight:550;padding:2.5px 6px;border-radius:5px;background:var(--bg4);color:var(--dim);white-space:nowrap}
.tg.a{background:var(--acc-soft);color:var(--acc)}

/* ---------- list rows ---------- */
.pv-rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.pv-row{display:flex;align-items:center;gap:11px;padding:8px 11px;border-bottom:1px solid var(--line);cursor:pointer}
.pv-row:last-child{border-bottom:0}
.pv-row:hover{background:var(--bg3)}
.pv-row .th{width:42px;height:34px;border-radius:6px;background:var(--bg4);flex:0 0 auto;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--dim2)}
.pv-row .th img{width:100%;height:100%;object-fit:cover}
.pv-row .th svg{width:17px;height:17px;opacity:.5}
.pv-row .nm{flex:1;min-width:0}
.pv-row .nm b{display:block;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-row .nm small{color:var(--dim2);font:500 11px/1.4 var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.pv-row .col{font:500 12px/1 var(--mono);color:var(--dim);flex:0 0 auto;text-align:right}

/* ---------- misc blocks ---------- */
.pv-empty{text-align:center;padding:64px 20px;color:var(--dim)}
.pv-empty svg{width:52px;height:52px;opacity:.22;margin-bottom:14px}
.pv-empty h3{font-size:16px;margin-bottom:6px;color:var(--txt)}
.pv-empty p{max-width:440px;margin:0 auto 16px;font-size:13px;line-height:1.6}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:15px;margin-bottom:14px}
.panel>h3{font-size:14px;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.panel>h3 svg{width:15px;height:15px;color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:11px;margin-bottom:16px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 13px}
.stat .k{font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);margin-bottom:5px}
.stat .v{font:700 21px/1.1 var(--mono);letter-spacing:-.02em}
.stat .sub{font-size:11.5px;color:var(--dim2);margin-top:3px}
.note{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--dim);line-height:1.6;margin-bottom:13px}
.note b{color:var(--txt)}
.note.bad{border-left-color:var(--bad)}
.note.ok{border-left-color:var(--ok)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--dim2);font-weight:550}
.kv dd{margin:0;font-family:var(--mono);font-size:12px;word-break:break-all}

/* ---------- table ---------- */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font:650 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--dim2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.t th:hover{color:var(--txt)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover{background:var(--bg3)}
table.t .num{font-family:var(--mono);text-align:right;font-size:12px}
.tw{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);overflow-x:auto}

/* ---------- modal ---------- */
.pv-ovl{position:fixed;inset:0;background:rgba(6,8,11,.72);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.pv-ovl.on{display:flex}
.pv-modal{background:var(--bg2);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:pop .16s ease-out;margin:auto}
.pv-modal.wide{max-width:900px}
.pv-modal.xl{max-width:1120px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}}
.pv-mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);border-radius:16px 16px 0 0;z-index:2}
.pv-mh h3{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-mb{padding:16px}
.pv-mf{display:flex;gap:9px;justify-content:flex-end;padding:13px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.pv-mf .sp{flex:1}

/* ---------- toast ---------- */
.pv-toasts{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.pv-toast{background:var(--bg3);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:9px;padding:10px 14px;box-shadow:var(--sh);font-size:13px;animation:slide .18s ease-out;max-width:380px;pointer-events:auto}
.pv-toast.ok{border-left-color:var(--ok)}
.pv-toast.bad{border-left-color:var(--bad)}
@keyframes slide{from{opacity:0;transform:translateX(20px)}}

/* ---------- progress ---------- */
.pv-prog{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);padding:9px 16px;display:none;align-items:center;gap:12px;z-index:60;box-shadow:0 -4px 20px rgba(0,0,0,.25)}
.pv-prog.on{display:flex}
.pv-prog .lbl{font-size:12.5px;color:var(--dim);flex:0 0 auto;min-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-prog .track{flex:1;height:5px;background:var(--bg4);border-radius:4px;overflow:hidden}
.pv-prog .fill{height:100%;background:var(--acc);width:0;transition:width .18s;border-radius:4px}
.pv-prog .pct{font:600 12px/1 var(--mono);color:var(--acc);min-width:44px;text-align:right}
.pv-prog .prog-note{font-size:11.5px;color:var(--dim2);max-width:340px;line-height:1.4;flex:0 1 auto}
@media(max-width:1100px){.pv-prog .prog-note{display:none}}
.spin{width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- detail ---------- */
.dt-hero{display:grid;grid-template-columns:280px 1fr;gap:18px;margin-bottom:4px}
.dt-img{aspect-ratio:1;background:var(--bg3);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.dt-img img{width:100%;height:100%;object-fit:contain}
.dt-img .ph{opacity:.25}
.dt-img .ph svg{width:64px;height:64px}
.dt-shots{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.dt-shots img{width:48px;height:48px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:pointer}
.dt-shots img:hover,.dt-shots img.on{border-color:var(--acc)}
.filelist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.filerow{display:flex;align-items:center;gap:9px;padding:7px 10px;background:var(--bg2);font-size:12.5px}
.filerow:hover{background:var(--bg3)}
.filerow svg{width:15px;height:15px;flex:0 0 auto;color:var(--dim2)}
.filerow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11.5px}
.filerow .z{font:500 11px/1 var(--mono);color:var(--dim2);flex:0 0 auto}
.ext{font:650 9.5px/1 var(--mono);padding:3px 5px;border-radius:4px;background:var(--bg4);color:var(--dim);text-transform:uppercase;flex:0 0 auto}
.ext.stl{background:rgba(90,169,255,.16);color:#7cbaff}
.ext.tmf{background:rgba(61,220,151,.16);color:var(--ok)}
.ext.gcode{background:var(--acc-soft);color:var(--acc)}
.ext.img{background:rgba(190,140,255,.16);color:#c39bff}

/* ---------- dupe groups ---------- */
.dupe{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:11px;overflow:hidden}
.dupe-h{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--bg3);border-bottom:1px solid var(--line);font-size:13px}
.dupe-h .hash{font:500 10.5px/1 var(--mono);color:var(--dim2)}
.dupe-h .sp{flex:1}
.dupe-f{display:flex;align-items:center;gap:9px;padding:8px 13px;border-bottom:1px solid var(--line);font-size:12.5px}
.dupe-f:last-child{border-bottom:0}
.dupe-f .p{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.dupe-f.keep{background:rgba(61,220,151,.05)}

/* ---------- filament swatch ---------- */
.sw{width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);flex:0 0 auto;box-shadow:inset 0 -6px 10px rgba(0,0,0,.18)}
.bar{height:6px;background:var(--bg4);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.bar i.low{background:var(--bad)}
.bar i.mid{background:var(--warn)}

/* ---------- queue ---------- */
.qcard{display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;margin-bottom:8px}
.qcard .th{width:46px;height:38px;border-radius:6px;overflow:hidden;background:var(--bg3);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.qcard .th img{width:100%;height:100%;object-fit:cover}
.qcard .th svg{width:18px;height:18px;color:var(--dim2);opacity:.5}
.qcard .nm{flex:1;min-width:0}
.qcard .nm b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qcard .nm small{color:var(--dim2);font-size:11.5px}
.pri{width:6px;align-self:stretch;border-radius:3px;background:var(--dim2)}
.pri.hi{background:var(--bad)}.pri.md{background:var(--warn)}.pri.lo{background:var(--dim2)}

/* ---------- responsive ---------- */
@media(max-width:900px){
  .dt-hero{grid-template-columns:1fr}
  .pv-side{position:fixed;top:0;bottom:0;left:0;z-index:50;box-shadow:0 0 40px rgba(0,0,0,.5);padding-top:14px}
  .pv-side.hide{display:none}
  .fr,.fr3{grid-template-columns:1fr}
}
@media(max-width:640px){
  .pv-top{flex-wrap:wrap;padding:8px 10px}
  .pv-search{order:3;flex-basis:100%;max-width:none}
  .pv-main{padding:12px 11px 60px}
  .pv-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .hide-sm{display:none!important}
}
.hidden{display:none!important}

const U = {
  id(p){ return (p||'') + Date.now().toString(36) + Math.random().toString(36).slice(2,8); },
  esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  attr(s){ return U.esc(s).replace(/`/g,'&#96;'); },
  today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); },
  bytes(n){ if(n==null) return '—'; if(n<1024) return n+' B';
    const u=['KB','MB','GB','TB']; let i=-1; do{ n/=1024; i++; }while(n>=1024 && i<3);
    return (n<10?n.toFixed(1):Math.round(n))+' '+u[i]; },
  dur(min){ if(min==null||!isFinite(min)) return '—'; min=Math.round(min);
    const d=Math.floor(min/1440), h=Math.floor(min%1440/60), m=min%60;
    return (d?d+'d ':'')+(h||d?h+'h ':'')+m+'m'; },
  num(n,d){ return n==null||!isFinite(n) ? '—' : Number(n).toLocaleString(undefined,{maximumFractionDigits:d==null?1:d}); },
  money(n){ return n==null||!isFinite(n) ? '—' : '$'+Number(n).toFixed(2); },
  ago(ts){ if(!ts) return 'never'; const s=(Date.now()-ts)/1000;
    if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago';
    if(s<86400) return Math.floor(s/3600)+'h ago'; if(s<2592000) return Math.floor(s/86400)+'d ago';
    return new Date(ts).toLocaleDateString(); },
  date(d){ if(!d) return '—'; const x = typeof d==='number' ? new Date(d) : new Date(d+'T12:00:00');
    return isNaN(x) ? '—' : x.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); },
  ext(name){ const i=name.lastIndexOf('.'); return i<0?'':name.slice(i+1).toLowerCase(); },
  base(path){ const i=path.lastIndexOf('/'); return i<0?path:path.slice(i+1); },
  dir(path){ const i=path.lastIndexOf('/'); return i<0?'':path.slice(0,i); },
  stem(name){ const i=name.lastIndexOf('.'); return i<0?name:name.slice(0,i); },
  titleize(s){ return String(s||'').replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim(); },
  debounce(fn,ms){ let t; return function(){ const a=arguments,c=this; clearTimeout(t); t=setTimeout(()=>fn.apply(c,a),ms||200); }; },
  sortBy(arr,key,dir){ const d=dir==='asc'?1:-1;
    return arr.slice().sort((a,b)=>{ const x=key(a), y=key(b);
      if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1;
      if(typeof x==='string') return x.localeCompare(y)*d;

  uniq(a){ return Array.from(new Set(a)); },
  clamp(n,a,b){ return Math.max(a,Math.min(b,n)); },
  hex2rgb(h){ h=(h||'').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');

  contrast(hex){ const [r,g,b]=U.hex2rgb(hex); return (r*299+g*587+b*114)/1000 > 145 ? '#101418' : '#ffffff'; },
  download(name, blob){ const a=document.createElement('a'), url=URL.createObjectURL(blob);

  // fuzzy-ish token match: every token must appear somewhere in the haystack

  tokens(q){ return String(q||'').toLowerCase().split(/\s+/).filter(Boolean); }
};

/* ============================================================
   DB — IndexedDB wrapper (stores + keyval meta)
   ============================================================ */
/* 'parked' holds model metadata from a backup that has nothing to attach to
   yet, because the folder hasn't been added or scanned. Scanning claims it. */
const STORES = ['meta','roots','files','models','prints','filaments','printers','queue','thumbs','parked'];
const DB = {
  _db:null,
  open(){
    if(DB._db) return Promise.resolve(DB._db);
    return new Promise((res,rej)=>{
      const req = indexedDB.open('printvault', 2);
      req.onupgradeneeded = e=>{
        const db = e.target.result;
        STORES.forEach(name=>{
          if(db.objectStoreNames.contains(name)) return;
          const st = db.createObjectStore(name, {keyPath:'id'});
          if(name==='files'){ st.createIndex('rootId','rootId'); st.createIndex('modelId','modelId'); st.createIndex('sha','sha'); st.createIndex('size','size'); }
          if(name==='models'){ st.createIndex('rootId','rootId'); }
          if(name==='prints'){ st.createIndex('modelId','modelId'); }
          if(name==='queue'){ st.createIndex('modelId','modelId'); }
        });
      };
      req.onsuccess = ()=>{ DB._db = req.result; res(DB._db); };
      req.onerror = ()=>rej(req.error);
    });
  },
  tx(names, mode){ return DB.open().then(db=>db.transaction(names, mode||'readonly')); },
  _req(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  get(store,id){ return DB.tx([store]).then(t=>DB._req(t.objectStore(store).get(id))); },
  all(store){ return DB.tx([store]).then(t=>DB._req(t.objectStore(store).getAll())); },
  put(store,val){ return DB.tx([store],'readwrite').then(t=>DB._req(t.objectStore(store).put(val))); },
  /* Written in chunks rather than one giant transaction. A library with
     hundreds of thousands of files would otherwise queue every put into a
     single transaction, locking the tab and risking an abort partway through.
     Chunking also means an interrupted write keeps everything already stored. */
  CHUNK: 2000,
  async putMany(store, vals, onProgress){
    if(!vals.length) return;
    for(let i=0;i<vals.length;i+=DB.CHUNK){
      const slice = vals.slice(i, i+DB.CHUNK);
      const t = await DB.tx([store],'readwrite');
      await new Promise((res,rej)=>{
        const st = t.objectStore(store);
        for(const v of slice) st.put(v);
        t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
      });
      if(onProgress) onProgress(Math.min(i+DB.CHUNK, vals.length), vals.length);
      if(vals.length > DB.CHUNK) await new Promise(r=>setTimeout(r,0));  // let the UI breathe
    }
  },
  del(store,id){ return DB.tx([store],'readwrite').then(t=>DB._req(t.objectStore(store).delete(id))); },
  async delMany(store, ids){
    if(!ids.length) return;
    for(let i=0;i<ids.length;i+=DB.CHUNK){
      const slice = ids.slice(i, i+DB.CHUNK);
      const t = await DB.tx([store],'readwrite');
      await new Promise((res,rej)=>{
        const st = t.objectStore(store);
        for(const id of slice) st.delete(id);
        t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
      });
      if(ids.length > DB.CHUNK) await new Promise(r=>setTimeout(r,0));
    }
  },
  clear(store){ return DB.tx([store],'readwrite').then(t=>DB._req(t.objectStore(store).clear())); },
  byIndex(store,index,val){ return DB.tx([store]).then(t=>DB._req(t.objectStore(store).index(index).getAll(val))); }
};

/* ============================================================
   Store — in-memory mirror + settings + subscribers
   ============================================================ */
const Store = {
  roots:[], models:[], files:[], prints:[], filaments:[], printers:[], queue:[], parked:[],
  settings:{
    theme:'dark', view:'grid', sort:'name', dir:'asc', sidebar:true,
    hashOnScan:false, thumbOnScan:true, thumbSize:320, currency:'$',
    skipDirs:'node_modules,.git,.svn,$RECYCLE.BIN,System Volume Information,.thumbnails',
    defaultPrinter:'', costPerHour:0.15, lastScan:0,
    dupeAction:'quarantine', quarantineDir:'_PrintVault_quarantine', keepPrefer:''
  },
  _subs:[],
  _idx:{ models:new Map(), files:new Map() },

  async load(){
    const meta = await DB.get('meta','settings');
    if(meta && meta.v) Object.assign(Store.settings, meta.v);
    const [roots,models,files,prints,filaments,printers,queue,parked] = await Promise.all([
      DB.all('roots'), DB.all('models'), DB.all('files'), DB.all('prints'),
      DB.all('filaments'), DB.all('printers'), DB.all('queue'), DB.all('parked')
    ]);
    Store.roots=roots; Store.models=models; Store.files=files;
    Store.prints=prints; Store.filaments=filaments; Store.printers=printers; Store.queue=queue;
    Store.parked=parked;
    Store.reindex();
  },
  reindex(){
    Store._idx.models = new Map(Store.models.map(m=>[m.id,m]));
    Store._idx.files = new Map(Store.files.map(f=>[f.id,f]));
  },
  model(id){ return Store._idx.models.get(id); },
  file(id){ return Store._idx.files.get(id); },
  modelFiles(id){ return Store.files.filter(f=>f.modelId===id); },
  modelPrints(id){ return Store.prints.filter(p=>p.modelId===id); },
  root(id){ return Store.roots.find(r=>r.id===id); },
  filament(id){ return Store.filaments.find(f=>f.id===id); },
  printer(id){ return Store.printers.find(p=>p.id===id); },

  async setting(k,v){ Store.settings[k]=v; await DB.put('meta',{id:'settings', v:Store.settings}); },
  async saveSettings(){ await DB.put('meta',{id:'settings', v:Store.settings}); },

  async put(coll, obj){
    obj.updatedAt = Date.now();
    if(!obj.createdAt) obj.createdAt = obj.updatedAt;
    await DB.put(coll, obj);
    const arr = Store[coll==='filaments'?'filaments':coll];
    const i = arr.findIndex(x=>x.id===obj.id);
    if(i<0) arr.push(obj); else arr[i]=obj;
    if(coll==='models'||coll==='files') Store.reindex();
    return obj;
  },
  async remove(coll, id){
    await DB.del(coll, id);
    const arr = Store[coll];
    const i = arr.findIndex(x=>x.id===id);
    if(i>=0) arr.splice(i,1);
    if(coll==='models'||coll==='files') Store.reindex();
  },
  subscribe(fn){ Store._subs.push(fn); },
  emit(){ Store._subs.forEach(f=>{ try{ f(); }catch(e){ console.error(e); } }); },

  allTags(){
    const m = new Map();
    Store.models.forEach(x=>(x.tags||[]).forEach(t=>m.set(t,(m.get(t)||0)+1)));
    return Array.from(m.entries()).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  },
  allCollections(){
    const m = new Map();
    Store.models.forEach(x=>(x.collections||[]).forEach(t=>m.set(t,(m.get(t)||0)+1)));
    return Array.from(m.entries()).sort((a,b)=>a[0].localeCompare(b[0]));
  }
};

      setTimeout(()=>el.remove(),260); }, ms||2800);

const Prog = {
  _cancel:false, _active:false,
  start(label){ Prog._cancel=false; Prog._active=true;
    document.getElementById('prog').classList.add('on');
    Prog.set(label,0,1); },
  set(label,done,total){
    if(!Prog._active) return;
    const pct = total ? Math.round(done/total*100) : 0;
    document.getElementById('progLbl').textContent = label;
    document.getElementById('progFill').style.width = pct+'%';
    document.getElementById('progPct').textContent = pct+'%';
  },
  stop(){ Prog._active=false; document.getElementById('prog').classList.remove('on'); },
  get cancelled(){ return Prog._cancel; }
};
document.getElementById('progCancel').onclick = ()=>{ Prog._cancel = true; Toast.show('Cancelling...'); };

const Modal = {
  _stack:[],
  /* opts.root starts a fresh stack (a top-level screen such as a model page).
     Anything opened on top of an existing dialog is remembered, so closing it
     returns to what you were looking at instead of dumping you back in the library. */
  open(title, bodyHtml, footerHtml, size, opts){
    const m = document.getElementById('modal'), ovl = document.getElementById('ovl');
    const wasOpen = ovl.classList.contains('on');
    if(opts && opts.root) Modal._stack.length = 0;
    else if(wasOpen && m.innerHTML)
      Modal._stack.push({html:m.innerHTML, cls:m.className, scroll:ovl.scrollTop, title:Modal._title});
    Modal._title = title;
    const back = Modal._stack.length > 0;
    m.className = 'pv-modal' + (size?' '+size:'');
    m.innerHTML =
      '<div class="pv-mh">'+
        (back ? '<button class="b g ico" onclick="PV.Modal.back()" title="Back to '+
                U.attr(Modal._stack[Modal._stack.length-1].title || 'previous')+'">'+I.chevL+'</button>' : '')+
        '<h3>'+U.esc(title)+'</h3>'+
        '<button class="b g ico" onclick="PV.Modal.close()" title="Close">'+I.x+'</button>'+
      '</div>'+
      '<div class="pv-mb">'+bodyHtml+'</div>'+
      (footerHtml ? '<div class="pv-mf">'+footerHtml+'</div>' : '');
    ovl.classList.add('on');
    if(!back) ovl.scrollTop = 0;
    const first = m.querySelector('input:not([type=hidden]),textarea,select');
    if(first) setTimeout(()=>first.focus(),40);
  },
  back(){
    const prev = Modal._stack.pop();
    if(!prev) return Modal.close();
    const m = document.getElementById('modal'), ovl = document.getElementById('ovl');
    m.className = prev.cls;
    m.innerHTML = prev.html;
    Modal._title = prev.title;
    ovl.scrollTop = prev.scroll || 0;
  },
  setBody(html){ const b=document.querySelector('#modal .pv-mb'); if(b) b.innerHTML=html; },
  setTitle(t){ const h=document.querySelector('#modal .pv-mh h3'); if(h){ h.textContent=t; Modal._title=t; } },
  close(){ Modal._stack.length = 0; document.getElementById('ovl').classList.remove('on');
    document.getElementById('modal').innerHTML=''; },
  confirm(title, msg, onYes, yesLabel, danger){
    Modal.open(title, '<p style="margin:0 0 4px;line-height:1.65;color:var(--dim)">'+msg+'</p>',
      '<button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b '+(danger?'d':'p')+'" id="mYes">'+U.esc(yesLabel||'Confirm')+'</button>');
    document.getElementById('mYes').onclick = ()=>{ Modal.close(); onYes(); };
  },
  val(id){ const e=document.getElementById(id); return e ? (e.type==='checkbox'? e.checked : e.value) : ''; },
  num(id){ const v=parseFloat(Modal.val(id)); return isFinite(v)?v:null; }
};
document.getElementById('ovl').addEventListener('mousedown', e=>{ if(e.target.id==='ovl') Modal.close(); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('ovl').classList.contains('on')) Modal.back();
  else if((e.key==='ArrowRight' || e.key==='ArrowLeft') && document.getElementById('vwWrap')
          && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    e.preventDefault(); Viewer.step(e.key==='ArrowRight' ? 1 : -1);
  }
  else if(e.key==='/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){ e.preventDefault(); document.getElementById('q').focus(); }
});

const KIND = {
