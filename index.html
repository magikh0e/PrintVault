    '</div>';

    if(crumbs.length) h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 12px">'+
      crumbs.map(c=>'<span class="tg a" style="display:inline-flex;align-items:center;gap:5px;padding:4px 8px">'+
        U.esc(c[0])+': <b>'+U.esc(c[1])+'</b><span style="cursor:pointer;opacity:.7" onclick="'+c[2]+'">&times;</span></span>').join('')+
      '<button class="b g sm" onclick="PV.Library.clearAll()">Clear all</button></div>';

    if(!Store.roots.length && !Store.models.length){
      v.innerHTML = h + Library.welcome();
      return;
    }
    if(!all.length){
      v.innerHTML = h + '<div class="pv-empty">'+I.cube+'<h3>No models match</h3>'+
        '<p>Try clearing filters or searching for something else.</p>'+

      '<div class="th">'+(m.thumbId ? '<img data-thumb="'+U.attr(m.thumbId)+'" alt="">' : I.cube)+'</div>'+
      '<div class="nm"><b>'+(m.favorite?'<span style="color:var(--warn)">&#9733;</span> ':'')+U.esc(m.name)+'</b>'+
        '<small>'+U.esc((Store.root(m.rootId)||{}).name||'')+'/'+U.esc(m.path)+'</small></div>'+
      '<div class="col hide-sm">'+(m.tags||[]).slice(0,2).map(t=>'<span class="tg">'+U.esc(t)+'</span>').join('')+'</div>'+
      '<div class="col" style="min-width:52px">'+m.fileCount+'f</div>'+
      '<div class="col" style="min-width:62px">'+U.bytes(m.bytes)+'</div>'+
      '<div class="col hide-sm" style="min-width:62px">'+(est.timeMin?U.dur(est.timeMin):'—')+'</div>'+
      '<div class="col" style="min-width:44px;color:'+(p.length?'var(--ok)':'var(--dim2)')+'">'+(p.length||'—')+'</div>'+
    '</div>';

  click(e, id){
    if(e.ctrlKey || e.metaKey || e.shiftKey){

  async fav(id){

  setSort(v){ Store.setting('sort', v); UI.render(); },
  flipDir(){ Store.setting('dir', Store.settings.dir==='asc'?'desc':'asc'); UI.render(); },
  more(){ UI.page++; UI.render(); },
  toggleSide(){ Store.setting('sidebar', !Store.settings.sidebar); UI.render(); },
  clearSearch(){ UI.filter.q=''; document.getElementById('q').value=''; UI.render(); },
  clearAll(){ UI.filter = {rootId:'',tag:'',coll:'',quick:'',q:''}; document.getElementById('q').value=''; UI.page=1; UI.render(); },

  rootMenu(id){
    const r = Store.root(id); if(!r) return;
    Modal.open('Folder: '+r.name,
      '<dl class="kv" style="margin-bottom:14px">'+
        '<dt>Models</dt><dd>'+(r.models||0).toLocaleString()+'</dd>'+
        '<dt>Files</dt><dd>'+(r.files||0).toLocaleString()+'</dd>'+
        '<dt>Size</dt><dd>'+U.bytes(r.bytes)+'</dd>'+
        '<dt>Last scan</dt><dd>'+U.ago(r.lastScan)+'</dd>'+
      '</dl>'+
      '<div class="note">Rescanning picks up new, changed, and deleted files. Your tags, notes, and print history are kept.</div>',
      '<button class="b d" onclick="PV.Library.removeRoot(\''+id+'\')">'+I.trash+' Remove from library</button>'+

      '<button class="b" onclick="PV.Library.renameRoot(\''+id+'\')">'+I.edit+' Rename</button>'+
      '<button class="b" onclick="PV.Modal.close()">Close</button>'+
      '<button class="b p" onclick="PV.Modal.close();PV.Scan.run([\''+id+'\'])">'+I.refresh+' Rescan</button>');

  renameRoot(id){
    const r = Store.root(id); if(!r) return;
    Modal.open('Rename folder',
      '<div class="f"><label>Display name</label><input id="rnName" value="'+U.attr(r.name)+'"></div>'+
      '<div style="color:var(--dim2);font-size:12px;line-height:1.6">Changes only the label shown in '+
      'PrintVault. Nothing on disk is renamed. Useful when a drive or network share reports its name as '+
      '<code>\\</code> or not at all.</div>',
      '<button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b p" onclick="PV.Library.saveRootName(\''+id+'\')">Save</button>');
  },
  async saveRootName(id){
    const r = Store.root(id); if(!r) return;
    const n = Modal.val('rnName').trim();
    if(!n) return Toast.err('Give the folder a name');
    r.name = n;
    await Store.put('roots', r);
    Modal.close(); UI.render(); Toast.ok('Renamed to "'+n+'"');
  },
  removeRoot(id){
    const r = Store.root(id); if(!r) return;
    Modal.confirm('Remove folder?',
      'This removes <b>'+U.esc(r.name)+'</b> and its '+(r.models||0)+' models from the PrintVault index, including any tags and notes you added to them. '+
      '<b>No files on disk are touched.</b> Print history entries stay but will point at missing models.',
      ()=>Scan.removeRoot(id), 'Remove from index', true);
  },

  bulk(){
    const ids = Array.from(Library.sel);
    Modal.open('Edit '+ids.length+' models',
      '<div class="f"><label>Add tags (comma separated)</label><input id="bTags" placeholder="dragon, articulated, gift"></div>'+
      '<div class="f"><label>Remove tags</label><input id="bRem" placeholder="wip, untested"></div>'+
      '<div class="f"><label>Add to collection</label><input id="bColl" placeholder="Halloween 2026" list="collList">'+
        '<datalist id="collList">'+Store.allCollections().map(c=>'<option value="'+U.attr(c[0])+'">').join('')+'</datalist></div>'+
      '<div class="f"><label>Set creator</label><input id="bCreator" placeholder="leave blank to keep"></div>'+
      '<label class="chk"><input type="checkbox" id="bFav"> Mark all as favorite</label>',
      '<button class="b d" onclick="PV.Library.bulkClear()">Deselect all</button><div class="sp"></div>'+
      '<button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b p" onclick="PV.Library.bulkApply()">Apply</button>');
  },
  bulkClear(){ Library.sel.clear(); Modal.close(); UI.render(); },
  async bulkApply(){
    const add = Modal.val('bTags').split(',').map(s=>s.trim()).filter(Boolean);
    const rem = Modal.val('bRem').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
    const coll = Modal.val('bColl').trim();
    const creator = Modal.val('bCreator').trim();
    const fav = Modal.val('bFav');
    const ids = Array.from(Library.sel);
    for(const id of ids){
      const m = Store.model(id); if(!m) continue;
      let tags = U.uniq((m.tags||[]).concat(add));
      if(rem.length) tags = tags.filter(t=>!rem.includes(t.toLowerCase()));
      m.tags = tags;
      if(coll) m.collections = U.uniq((m.collections||[]).concat([coll]));
      if(creator) m.creator = creator;
      if(fav) m.favorite = true;
      m.updatedAt = Date.now();
    }
    await DB.putMany('models', ids.map(i=>Store.model(i)).filter(Boolean));
    Library.sel.clear(); Modal.close(); UI.render();
    Toast.ok('Updated '+ids.length+' models');
  }
};

        U.esc(c)+'</span>').join(''))+
      '</div>';

    h += '<dl class="kv" style="margin-bottom:12px">';

/* ============================================================
   Archive — look inside a zip that was never extracted
   ============================================================ */
const Archive = {
  _cache:new Map(),   // modelId -> [{name,size}]

  file(m){ return Store.modelFiles(m.id).find(f=>f.kind === 'arch'); },

  section(m){
    const f = Archive.file(m);
    if(!f) return '';
    const listed = Archive._cache.get(m.id) || (f.zip && f.zip.entries);
    let h = '<hr><div style="display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap">'+
      '<h3 style="font-size:13px;color:var(--dim);flex:1">Archive contents</h3>';
    if(f.ext === 'zip'){
      h += '<button class="b sm" onclick="PV.Archive.peek(\''+m.id+'\')">'+I.refresh+
           (listed ? ' Re-read' : ' Look inside')+'</button>'+
           '<button class="b sm p" onclick="PV.Archive.extractPrompt(\''+m.id+'\')">'+I.dl+' Extract here</button>';
    }
    h += '</div>';

    if(f.ext !== 'zip')
      return h + '<div class="note bad">This is a <b>.'+U.esc(f.ext)+'</b> archive. PrintVault can only read '+
        'inside <b>.zip</b> files, so the contents cannot be listed. Extract it next to the archive and rescan '+
        'to index what is inside.</div>';

    if(!listed)
      return h + '<div class="note">This archive was never extracted, so PrintVault indexed it as a single '+
        'file. Read the listing to see what is inside without unpacking it, or extract it to make the models '+
        'usable in your slicer ('+U.bytes(f.size)+' compressed).</div>';

    if(listed.error) return h + '<div class="note bad">'+U.esc(listed.error)+'</div>';

    const meshes = listed.filter(e=>['stl','3mf','obj'].includes(U.ext(e.name)));
    const others = listed.filter(e=>!['stl','3mf','obj'].includes(U.ext(e.name)));
    h += '<div style="color:var(--dim2);font-size:12.5px;margin-bottom:9px">'+
      listed.length+' entries, '+meshes.length+' printable'+
      (meshes.length ? '. Preview one without extracting the archive.' : '.')+'</div>';
    h += '<div class="filelist">';
    h += meshes.concat(others).slice(0, 80).map(e=>{
      const ex = U.ext(e.name);
      const cls = ex==='stl'?'stl' : ex==='3mf'?'tmf' : kindOf(ex)==='image'?'img' : '';
      const isMesh = ['stl','3mf','obj'].includes(ex);
      return '<div class="filerow">'+(isMesh?I.cube:kindOf(ex)==='image'?I.img:I.doc)+
        '<span class="n" title="'+U.attr(e.name)+'">'+U.esc(e.name)+'</span>'+
        '<span class="ext '+cls+'">'+U.esc(ex||'?')+'</span>'+
        '<span class="z" style="min-width:56px;text-align:right">'+U.bytes(e.size)+'</span>'+
        (isMesh ? '<button class="b g sm ico" title="Preview in 3D" onclick="PV.Archive.preview(\''+m.id+'\','+
          JSON.stringify(e.name).replace(/"/g,'&quot;')+')">'+I.eye+'</button>' : '')+
        '</div>';
    }).join('');
    h += '</div>';
    if(listed.length > 80) h += '<div style="color:var(--dim2);font-size:12px;padding:7px 2px">'+
      'Showing 80 of '+listed.length+' entries.</div>';
    return h;
  },

  /* List an archive's contents by reading only its tail, where the zip central
     directory lives. A 30 MB archive costs about 256 KB of reads. */
  async entries(f){
    if(!f) throw new Error('No archive file on this model');
    if(f.ext !== 'zip' && f.ext !== '3mf') throw new Error('Only .zip and .3mf containers can be read');
    let want = 262144;
    for(let attempt = 0; attempt < 4; attempt++){
      const t = await FS.readTail(f.rootId, f.path, want);
      try{
        const out = await Work.call({op:'zipnames', buf:t.buf, base:t.base}, [t.buf]);
        return out.entries;
      }catch(e){
        const m = /^NEEDMORE:(\d+)/.exec(e.message);
        if(!m) throw e;
        const need = +m[1];
        if(need >= t.size){ want = t.size; }             // give up and read it all
        else if(need <= want) throw e;                   // no progress possible
        else want = Math.min(need, t.size);
      }
    }
    throw new Error('Could not locate the archive index');
  },

  /* Where an entry's payload starts, after its local header */
  async dataStart(file, ent){
    const head = new DataView(await file.slice(ent.lho, ent.lho + 30).arrayBuffer());
    if(head.getUint32(0, true) !== 0x04034b50) throw new Error('Damaged entry header');
    return ent.lho + 30 + head.getUint16(26, true) + head.getUint16(28, true);
  },

  /* Stream one entry straight to disk. Nothing is held in memory, which is what
     large entries were failing on, and the bytes are checksummed on the way
     past so a short or corrupt write is caught rather than left on disk. */
  async extractTo(f, ent, destDir, segs){
    if(ent.method !== 0 && ent.method !== 8)
      throw new Error('Unsupported compression in "'+U.base(ent.name)+'" (method '+ent.method+')');
    const file = await FS.read(f.rootId, f.path);
    const start = await Archive.dataStart(file, ent);

    let dir = destDir;
    for(let i=0;i<segs.length-1;i++) dir = await dir.getDirectoryHandle(segs[i], {create:true});
    const leaf = segs[segs.length-1];
    const fh = await dir.getFileHandle(leaf, {create:true});
    const w = await fh.createWritable();

    let crc = 0, bytes = 0;
    const meter = new TransformStream({
      transform(chunk, ctrl){ crc = FS.crc32(chunk, crc); bytes += chunk.length; ctrl.enqueue(chunk); }
    });
    let src = file.slice(start, start + ent.csize).stream();
    if(ent.method === 8) src = src.pipeThrough(new DecompressionStream('deflate-raw'));
    try{
      await src.pipeThrough(meter).pipeTo(w);
    }catch(e){
      try{ await w.abort(); }catch(_){}
      try{ await dir.removeEntry(leaf); }catch(_){}
      throw new Error('Write failed for "'+U.base(ent.name)+'": '+((e && e.message) || e));
    }
    const sizeBad = bytes !== ent.size;
    const crcBad = ent.crc != null && ent.crc !== 0 && crc !== ent.crc;
    if(sizeBad || crcBad){
      try{ await dir.removeEntry(leaf); }catch(_){}
      throw new Error('Verification failed for "'+U.base(ent.name)+'": '+
        (sizeBad ? U.bytes(bytes)+' written of '+U.bytes(ent.size) : 'checksum mismatch'));
    }
    return bytes;
  },

  /* Pull one entry into memory, for previews and thumbnails */
  async extractEntry(f, ent){
    const head = new DataView(await FS.readRange(f.rootId, f.path, ent.lho, ent.lho + 30));
    if(head.getUint32(0, true) !== 0x04034b50) throw new Error('Damaged entry header');
    const nlen = head.getUint16(26, true), elen = head.getUint16(28, true);
    const start = ent.lho + 30 + nlen + elen;
    const raw = new Uint8Array(await FS.readRange(f.rootId, f.path, start, start + ent.csize));
    if(ent.method === 0) return raw;
    if(ent.method === 8) return await FS.inflateRaw(raw);
    throw new Error('Unsupported compression in "' + U.base(ent.name) + '" (method ' + ent.method + ')');
  },

  async peek(modelId){
    const m = Store.model(modelId); if(!m) return;
    const f = Archive.file(m);
    Toast.show('Reading archive index...');
    try{
      const entries = await Archive.entries(f);
      Archive._cache.set(modelId, entries);
      Toast.ok(entries.length+' entries found');
    }catch(e){
      const bad = []; bad.error = 'Could not read this archive: ' + e.message;
      Archive._cache.set(modelId, bad);
      Toast.err(e.message);
    }
    Detail.open(modelId);
  },

  /* ---- extraction ---- */
  extractPrompt(modelId){
    const m = Store.model(modelId); if(!m) return;
    const f = Archive.file(m); if(!f) return;
    const dest = (U.dir(f.path) ? U.dir(f.path)+'/' : '') + U.stem(f.name);
    Modal.open('Extract '+f.name+'?',
      '<p style="color:var(--dim);line-height:1.65;margin:0 0 12px">Unpacks the archive into a new folder beside it:</p>'+
      '<div class="mono" style="background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:9px 11px;'+
        'font-size:12px;word-break:break-all;color:var(--acc)">'+U.esc((Store.root(f.rootId)||{}).name+'/'+dest)+'/</div>'+
      '<div class="note" style="margin-top:12px">The archive itself is left alone. Once extracted it shows up under '+
        '<b>Duplicates &rarr; Extracted archives</b>, where you can review and delete the originals in bulk.</div>'+
      '<div class="note bad">Your browser will ask for permission to write to this folder. '+
        'PrintVault only writes inside the destination above.</div>',
      '<button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b p" onclick="PV.Archive.extract(\''+modelId+'\')">Extract</button>');
  },

  _last:null,
  async extract(modelId){
    Modal.close();
    Archive._last = modelId;
    const m = Store.model(modelId); if(!m) return;
    const f = Archive.file(m); if(!f) return;
    const root = Store.root(f.rootId);
    if(!root) return Toast.err('Folder is not connected, click Scan first');
    if(!(await FS.ensure(root, 'readwrite'))) return Toast.err('Write permission denied');
    Prog.start('Extracting '+f.name+'...');
    const r = await Archive._run(f, root);
    Prog.stop();
    if(!r.ok) Toast.err(r.error);
    else if(r.failed) Archive.report(f.name, r);
    else Toast.ok('Extracted '+r.written+' file'+(r.written===1?'':'s')+', all verified. Rescan to index them.');
    if(!r.failed) Detail.open(modelId);
  },

  /* A partial extraction is worth stopping on, not a line in a toast */
  report(name, r){
    Modal.open('Extraction incomplete: '+name,
      '<div class="note bad"><b>'+r.written+' file'+(r.written===1?'':'s')+' extracted and verified, '+
      r.failed+' failed.</b><br>Failed entries were not left behind as partial files.</div>'+
      '<div style="max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;'+
      'padding:9px 11px;background:var(--bg3)">'+
      r.problems.slice(0,40).map(p=>'<div class="mono" style="font-size:11.5px;padding:3px 0;'+
        'word-break:break-word;color:var(--dim)">'+U.esc(p)+'</div>').join('')+
      (r.problems.length>40 ? '<div style="color:var(--dim2);font-size:12px;padding-top:6px">...and '+
        (r.problems.length-40)+' more</div>' : '')+
      '</div>'+
      '<p style="color:var(--dim);font-size:12.5px;line-height:1.6;margin:12px 0 0">Very large entries can fail '+
      'when the source is on a slow or flaky connection such as a network share. Extracting again only '+
      'rewrites what is missing.</p>',
      '<button class="b" onclick="PV.Modal.close()">Close</button>'+
      '<button class="b p" onclick="PV.Modal.close();PV.Archive.extract(PV.Archive._last)">Try again</button>');
  },

  async _run(f, root){
    let written = 0, failed = 0;
    const problems = [];

    // The desktop shell unpacks in Rust, so entry bytes never cross the bridge
    // and compression methods browsers cannot inflate still work.
    if(FS.extractNatively){
      try{
        const destRel = (U.dir(f.path) ? U.dir(f.path) + '/' : '') + U.stem(f.name);
        Prog.set('Extracting '+f.name+'...', 0, 1);
        const r = await FS.extractNatively(f.rootId, f.path, destRel);
        return {ok:true, written:r.written, failed:r.failed, problems:r.problems || []};
      }catch(e){
        return {ok:false, error:'Extraction failed: '+((e && e.message) || e), written:0, failed:0, problems:[]};
      }
    }

    try{
      const entries = await Archive.entries(f);
      const destSegs = (U.dir(f.path) ? U.dir(f.path).split('/') : []).concat([U.stem(f.name)]);
      const destDir = await FS.mkdirp(Store.root(f.rootId).handle, destSegs);
      for(let i = 0; i < entries.length; i++){
        if(Prog.cancelled) break;
        const ent = entries[i];
        Prog.set('Extracting ('+(i+1)+'/'+entries.length+') '+U.base(ent.name), i, entries.length);
        const segs = FS.safeSegs(ent.name);
        if(!segs){ failed++; problems.push(ent.name+' (unsafe path, refused)'); continue; }
        try{
          await Archive.extractTo(f, ent, destDir, segs);
          written++;
        }catch(e){ failed++; problems.push(String((e && e.message) || e)); }
      }
      return {ok:true, written, failed, problems};
    }catch(e){
      return {ok:false, error:'Extraction failed: '+e.message, written, failed, problems};
    }
  },

  bulkPrompt(){
    const list = Store.models.filter(m=>m.isArchive && m.archiveExt === 'zip');
    if(!list.length) return Toast.err('No unextracted zip archives in the library');
    const bytes = list.reduce((s,m)=>s+(m.bytes||0), 0);
    Modal.open('Extract '+list.length+' archives?',
      '<p style="color:var(--dim);line-height:1.65;margin:0 0 12px">Each archive is unpacked into a new folder '+
        'beside it. Archives themselves are left in place.</p>'+
      '<dl class="kv"><dt>Archives</dt><dd>'+list.length+'</dd>'+
      '<dt>Compressed</dt><dd>'+U.bytes(bytes)+'</dd>'+
      '<dt>On disk after</dt><dd>roughly '+U.bytes(bytes*1.7)+'</dd></dl>'+
      '<div class="note bad" style="margin-top:12px">This writes a lot of files. If the folder is synced by '+
        'OneDrive, Dropbox or similar, all of it will upload. You can cancel partway through.</div>',
      '<button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b p" onclick="PV.Archive.bulk()">Extract all</button>');
  },

  async bulk(){
    Modal.close();
    const list = Store.models.filter(m=>m.isArchive && m.archiveExt === 'zip');
    const roots = U.uniq(list.map(m=>m.rootId));
    for(const rid of roots){
      const root = Store.root(rid);
      if(!root || !root.handle) return Toast.err('Folder is not connected, click Scan first');
      if(!(await FS.ensure(root, 'readwrite'))) return Toast.err('Write permission denied');
    }
    Prog.start('Extracting archives...');
    let done = 0, files = 0, bad = 0;
    for(const m of list){
      if(Prog.cancelled) break;
      const f = Archive.file(m);
      if(!f) continue;
      Prog.set('Archive '+(done+1)+'/'+list.length+': '+f.name, done, list.length);
      const r = await Archive._run(f, Store.root(m.rootId));
      if(r.ok) files += r.written; else bad++;
      done++;
    }
    Prog.stop();
    Toast.ok('Extracted '+files+' files from '+done+' archives'+(bad?', '+bad+' failed':'')+
      '. Run a scan to index them.');
    UI.render();
  },

  /* Hand off to the viewer with every mesh in the archive queued up */
  async preview(modelId, entryName){
    const m = Store.model(modelId); if(!m) return;
    const af = Archive.file(m); if(!af) return;
    let entries = Archive._cache.get(modelId) || (af.zip && af.zip.entries);
    if(!entries){
      Toast.show('Reading archive index...');
      try{ entries = await Archive.entries(af); Archive._cache.set(modelId, entries); }
      catch(e){ return Toast.err(e.message); }
    }
    await Viewer.openArchive(modelId, entryName, entries);
  }
};

/* ============================================================
   Viewer — interactive 3D preview
   ============================================================ */
const Viewer = {
  data:null, az:-52, el:26, zoom:1, drag:null,
  list:[], idx:0, busy:false,

  MESH:['stl','3mf','obj'],
  /* natural order so black2 sorts before black10 */
  _nat(a,b){ return a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}); },

  /* Open a file, with every other mesh in the same model queued up beside it */
  async open(fileId){
    const f = Store.file(fileId); if(!f) return;
    const sibs = Store.modelFiles(f.modelId)
      .filter(x=>Viewer.MESH.includes(x.ext))
      .sort((a,b)=>Viewer._nat(a.path, b.path));
    const list = sibs.map(x=>({src:'file', fileId:x.id, modelId:x.modelId, name:x.name, path:x.path}));
    const i = Math.max(0, list.findIndex(x=>x.fileId === fileId));
    await Viewer.openList(list.length ? list : [{src:'file', fileId:f.id, modelId:f.modelId, name:f.name, path:f.path}], i);
  },

  /* Open a mesh from inside an archive, with the archive's other meshes queued */
  async openArchive(modelId, entryName, entries){
    const m = Store.model(modelId); if(!m) return;
    const af = Archive.file(m); if(!af) return;
    const meshes = (entries||[]).filter(x=>Viewer.MESH.includes(U.ext(x.name)))
      .sort((a,b)=>Viewer._nat(a.name, b.name));
    const list = meshes.map(x=>({src:'zip', fileId:af.id, modelId, name:U.base(x.name), path:x.name, size:x.size}));
    const i = Math.max(0, list.findIndex(x=>x.path === entryName));
    await Viewer.openList(list.length ? list : [{src:'zip', fileId:af.id, modelId, name:U.base(entryName), path:entryName}], i);
  },

  async openList(list, idx){
    Viewer.list = list; Viewer.idx = idx || 0;
    Modal.open('3D view: '+list[Viewer.idx].name,
      '<div id="vwWrap" style="display:flex;align-items:center;justify-content:center;min-height:380px;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden">'+
      '<div style="text-align:center;color:var(--dim)"><div class="spin" style="margin:0 auto 10px"></div>Loading mesh...</div></div>'+
      '<div id="vwInfo" style="margin-top:10px;color:var(--dim2);font-size:12px" class="mono"></div>',
      (list.length > 1
        ? '<button class="b" id="vwPrev" onclick="PV.Viewer.step(-1)" title="Previous part (left arrow)">'+I.chevL+'</button>'+
          '<span id="vwPos" class="mono" style="align-self:center;font-size:12px;color:var(--dim);min-width:64px;text-align:center"></span>'+
          '<button class="b" id="vwNext" onclick="PV.Viewer.step(1)" title="Next part (right arrow)">'+
            I.chevL.replace('<svg','<svg style="transform:rotate(180deg)"')+'</button>'
        : '')+
      '<span class="hide-sm" style="color:var(--dim2);font-size:12px;align-self:center;margin-left:6px">Drag to orbit, scroll to zoom</span>'+
      '<div class="sp"></div>'+
      '<button class="b" onclick="PV.Viewer.reset()">Reset view</button>'+
      '<button class="b p" onclick="PV.Viewer.useAsCover()">Use as cover</button>', 'wide');
    await Viewer.load();
  },

  step(d){
    if(Viewer.busy || Viewer.list.length < 2) return;
    const n = Viewer.list.length;
    Viewer.idx = (Viewer.idx + d % n + n) % n;
    Viewer.load();
  },

  /* Fetch the raw bytes for a queue item, from disk or from inside a zip */
  async bytesFor(item){
    if(item.src === 'zip'){
      const af = Store.file(item.fileId);
      if(!af) throw new Error('Archive is no longer indexed');
      const entries = Archive._cache.get(item.modelId) || (af.zip && af.zip.entries) || await Archive.entries(af);
      const ent = entries.find(x=>x.name === item.path);
      if(!ent) throw new Error('Entry not found in archive');
      const b = await Archive.extractEntry(af, ent);
      return {buf: b.buffer.slice(b.byteOffset, b.byteOffset + b.byteLength), ext:U.ext(item.path), size:ent.size};
    }
    const f = Store.file(item.fileId);
    if(!f) throw new Error('File is no longer indexed');
    const file = await FS.read(f.rootId, f.path);
    if(file.size > 500e6) throw new Error('File is too large to preview ('+U.bytes(file.size)+')');
    return {buf: await file.arrayBuffer(), ext:f.ext, size:file.size};
  },

  async load(){
    const item = Viewer.list[Viewer.idx];
    if(!item) return;
    Viewer.busy = true;
    Viewer.sync();
    Modal.setTitle('3D view: '+item.name);
    const wrap = document.getElementById('vwWrap');
    if(wrap) wrap.innerHTML = '<div style="text-align:center;color:var(--dim)">'+
      '<div class="spin" style="margin:0 auto 10px"></div>Loading '+U.esc(item.name)+'...</div>';
    try{
      const {buf, ext, size} = await Viewer.bytesFor(item);
      const out = await Work.call({op:'mesh', buf, ext, maxTri:900000, needMesh:true}, [buf]);
      if(!out.pos || !out.pos.length) throw new Error('No mesh geometry found in this file');
      Viewer.data = {pos:out.pos, nrm:out.nrm, bbox:out.bbox, tris:out.tris,
        file:{id:item.fileId, modelId:item.modelId, name:item.name, size:size}};
      Viewer.az=-52; Viewer.el=26; Viewer.zoom=1;
      Viewer.mount();
    }catch(e){
      Viewer.data = null;
      const w = document.getElementById('vwWrap');
      if(w) w.innerHTML = '<div style="text-align:center;color:var(--dim);padding:30px">'+I.warn+
        '<div style="margin-top:10px">'+U.esc(e.message)+'</div></div>';
      const inf = document.getElementById('vwInfo'); if(inf) inf.textContent = '';
    }
    Viewer.busy = false;
    Viewer.sync();
  },

  /* keep the counter and arrows in step with the queue */
  sync(){
    const pos = document.getElementById('vwPos');
    if(pos) pos.textContent = (Viewer.idx+1) + ' / ' + Viewer.list.length;
    ['vwPrev','vwNext'].forEach(id=>{
      const b = document.getElementById(id);
      if(b) b.disabled = Viewer.busy || Viewer.list.length < 2;
    });
  },

  mount(){
    const wrap = document.getElementById('vwWrap'); if(!wrap) return;
    const w = Math.min(820, wrap.clientWidth || 820), h = Math.round(w*0.62);
    wrap.innerHTML = '';
    Viewer.w = w; Viewer.h = h;
    Viewer.paint();
    const cv = Render.canvas();
    cv.style.width = '100%'; cv.style.height = 'auto'; cv.style.display = 'block'; cv.style.cursor = 'grab';
    wrap.appendChild(cv);
    const d = Viewer.data, item = Viewer.list[Viewer.idx];
    document.getElementById('vwInfo').innerHTML =
      d.bbox.size.map(x=>U.num(x,1)).join(' &times; ') + ' mm &nbsp;·&nbsp; ' +
      d.tris.toLocaleString() + ' triangles &nbsp;·&nbsp; ' + U.bytes(d.file.size) +
      (item && item.src === 'zip' ? ' &nbsp;·&nbsp; inside archive' : '') +
      (item && item.path && item.path !== item.name
        ? '<br><span style="opacity:.7">' + U.esc(item.path) + '</span>' : '');

    cv.onpointerdown = e=>{ Viewer.drag = {x:e.clientX, y:e.clientY, az:Viewer.az, el:Viewer.el};
      cv.setPointerCapture(e.pointerId); cv.style.cursor='grabbing'; };
    cv.onpointermove = e=>{
      if(!Viewer.drag) return;
      Viewer.az = Viewer.drag.az - (e.clientX - Viewer.drag.x) * 0.55;
      Viewer.el = U.clamp(Viewer.drag.el + (e.clientY - Viewer.drag.y) * 0.45, -85, 85);
      Viewer.paint();
    };
    cv.onpointerup = cv.onpointercancel = e=>{ Viewer.drag=null; cv.style.cursor='grab'; };
    cv.onwheel = e=>{ e.preventDefault(); Viewer.zoom = U.clamp(Viewer.zoom * (e.deltaY < 0 ? 1.12 : 0.89), 0.25, 12); Viewer.paint(); };
  },
  paint(){
    const d = Viewer.data; if(!d) return;
    const dark = document.documentElement.getAttribute('data-theme') !== 'light';
    Render.draw(d.pos, d.nrm, d.bbox, {size:Viewer.w, height:Viewer.h, az:Viewer.az, el:Viewer.el, zoom:Viewer.zoom,
      bg: dark ? [0.055,0.063,0.078] : [0.94,0.95,0.97]});
  },
  reset(){ Viewer.az=-52; Viewer.el=26; Viewer.zoom=1; Viewer.paint(); },
  async useAsCover(){
    const d = Viewer.data; if(!d) return;
    const m = Store.model(d.file.modelId); if(!m) return Toast.err('No model for this file');
    const blob = await Render.toBlob(d.pos, d.nrm, d.bbox, {size:Store.settings.thumbSize, az:Viewer.az, el:Viewer.el, zoom:Viewer.zoom});
    if(!blob) return Toast.err('Render failed');
    const id = 'tm'+m.id;
    await Thumbs.put(id, blob);
    Thumbs._urls.delete(id);
    m.thumbId = id; m.thumbSrc = 'user'; m.bbox = d.bbox; m.tris = d.tris;
    await Store.put('models', m);
    Toast.ok('Cover updated from this angle');
    Detail.open(m.id); UI.render();
  }
};

/* ============================================================

   ============================================================ */
const RESULTS = [['success','Success','ok'],['partial','Partial / usable','warn'],['fail','Failed','bad']];
const MATERIALS = ['PLA','PLA+','PETG','ABS','ASA','TPU','Nylon','PC','PVA','HIPS','PLA-CF','PETG-CF','PA-CF','Resin'];

const Prints = {
  filter:{printer:'', result:''},

  render(v){
    const s = Store.settings;
    let all = U.sortBy(Store.prints, p=>p.date||'', 'desc');
    const toks = U.tokens(UI.filter.q);
    if(Prints.filter.printer) all = all.filter(p=>p.printer === Prints.filter.printer);
    if(Prints.filter.result) all = all.filter(p=>p.result === Prints.filter.result);
    if(toks.length) all = all.filter(p=>{
      const m = Store.model(p.modelId);
      return U.match((m?m.name:'')+' '+(p.printer||'')+' '+(p.material||'')+' '+(p.notes||'')+' '+(p.filamentName||''), toks);
    });

    const ok = all.filter(p=>p.result==='success').length;
    const g = all.reduce((s,p)=>s+(p.grams||0), 0);
    const t = all.reduce((s,p)=>s+(p.timeMin||0), 0);
    const c = all.reduce((s,p)=>s+(Prints.cost(p)||0), 0);
    const printers = U.uniq(Store.prints.map(p=>p.printer).filter(Boolean));

    let h = '<div class="pv-bar"><h2>Print History</h2><span class="cnt">'+all.length+' logged</span><div class="sp"></div>'+
      '<select class="b sm" onchange="PV.Prints.setFilter(\'printer\',this.value)"><option value="">All printers</option>'+
        printers.map(p=>'<option'+(Prints.filter.printer===p?' selected':'')+'>'+U.esc(p)+'</option>').join('')+'</select>'+
      '<select class="b sm" onchange="PV.Prints.setFilter(\'result\',this.value)"><option value="">All results</option>'+
        RESULTS.map(r=>'<option value="'+r[0]+'"'+(Prints.filter.result===r[0]?' selected':'')+'>'+r[1]+'</option>').join('')+'</select>'+
      '<button class="b sm p" onclick="PV.Prints.log()">'+I.plus+' Log print</button></div>';

    h += '<div class="stats">'+
      '<div class="stat"><div class="k">Prints</div><div class="v">'+all.length+'</div>'+
        '<div class="sub">'+(all.length?Math.round(ok/all.length*100)+'% success':'no data')+'</div></div>'+
      '<div class="stat"><div class="k">Filament used</div><div class="v">'+U.num(g/1000,2)+'<span style="font-size:13px;color:var(--dim2)"> kg</span></div>'+
        '<div class="sub">'+U.num(g,0)+' g total</div></div>'+
      '<div class="stat"><div class="k">Machine time</div><div class="v">'+U.num(t/60,0)+'<span style="font-size:13px;color:var(--dim2)"> h</span></div>'+
        '<div class="sub">'+U.dur(t)+'</div></div>'+
      '<div class="stat"><div class="k">Est. cost</div><div class="v">'+U.money(c)+'</div>'+
        '<div class="sub">filament + power</div></div>'+
      '</div>';

    if(!all.length){
      h += '<div class="pv-empty">'+I.print+'<h3>No prints logged yet</h3>'+
        '<p>Log a print when it finishes and PrintVault remembers the printer, filament, layer height, and how it turned out. '+
        'Next time you open that model the settings are right there.</p>'+
        '<button class="b p" onclick="PV.Prints.log()">'+I.plus+' Log your first print</button></div>';
      v.innerHTML = h; return;
    }

    h += '<div class="tw"><table class="t"><thead><tr><th>Date</th><th>Model</th><th>Result</th><th>Printer</th><th>Filament</th>'+
      '<th class="num">Layer</th><th class="num">Grams</th><th class="num">Time</th><th class="num">Cost</th><th>Notes</th><th></th></tr></thead><tbody>'+
      all.map(p=>Prints.row(p, false)).join('')+'</tbody></table></div>';
    v.innerHTML = h;
  },

  setFilter(k,val){ Prints.filter[k]=val; UI.render(); },

  cost(p){
    let c = 0;
    const fil = p.filamentId ? Store.filament(p.filamentId) : null;
    const perKg = (p.costPerKg != null ? p.costPerKg : (fil ? fil.costPerKg : null));
    if(p.grams && perKg) c += p.grams/1000 * perKg;
    if(p.timeMin && Store.settings.costPerHour) c += p.timeMin/60 * Store.settings.costPerHour;
    return c || null;
  },

  row(p, compact){
    const m = Store.model(p.modelId);
    const r = RESULTS.find(x=>x[0]===p.result) || RESULTS[0];
    const fil = p.filamentId ? Store.filament(p.filamentId) : null;
    const filName = fil ? (fil.brand+' '+fil.material+(fil.colorName?' '+fil.colorName:'')) : (p.filamentName || p.material || '');
    const sw = fil && fil.colorHex ? '<span class="sw" style="width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-1px;background:'+U.attr(fil.colorHex)+'"></span> ' : '';
    return '<tr>'+
      '<td class="mono" style="white-space:nowrap;font-size:12px">'+U.date(p.date)+'</td>'+
      (compact ? '' : '<td>'+(m ? '<a href="#" onclick="event.preventDefault();PV.Modal.close();PV.Detail.open(\''+p.modelId+'\')">'+U.esc(m.name)+'</a>'
                              : '<span style="color:var(--dim2)">'+U.esc(p.modelName||'(removed)')+'</span>')+'</td>')+
      '<td><span class="bdg '+r[2]+'">'+r[1].split(' ')[0]+'</span></td>'+
      '<td style="font-size:12.5px">'+U.esc(p.printer||'—')+'</td>'+
      '<td style="font-size:12.5px;white-space:nowrap">'+sw+U.esc(filName||'—')+'</td>'+
      '<td class="num">'+(p.layerH?p.layerH:'—')+'</td>'+
      '<td class="num">'+(p.grams?U.num(p.grams,0):'—')+'</td>'+
      '<td class="num">'+(p.timeMin?U.dur(p.timeMin):'—')+'</td>'+
      (compact ? '' : '<td class="num">'+U.money(Prints.cost(p))+'</td>')+
      '<td style="font-size:12px;color:var(--dim);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+U.attr(p.notes||'')+'">'+U.esc(p.notes||'')+'</td>'+
      '<td style="white-space:nowrap"><button class="b g sm ico" onclick="PV.Prints.log(null,\''+p.id+'\')" title="Edit">'+I.edit+'</button>'+
        '<button class="b g sm ico" onclick="PV.Prints.del(\''+p.id+'\')" title="Delete">'+I.trash+'</button></td>'+
    '</tr>';
  },

  log(modelId, printId){
    const p = printId ? Store.prints.find(x=>x.id===printId) : null;
    const m = Store.model(p ? p.modelId : modelId);
    const est = (m && m.est) || {};
    const models = U.sortBy(Store.models, x=>x.name.toLowerCase(), 'asc');
    const modelOpts = models.length > 4000
      ? (m ? '<option value="'+U.attr(m.id)+'" selected>'+U.esc(m.name)+'</option>' : '')
      : '<option value="">(not in library)</option>'+models.map(x=>
          '<option value="'+U.attr(x.id)+'"'+((p?p.modelId:modelId)===x.id?' selected':'')+'>'+U.esc(x.name)+'</option>').join('');

    Modal.open(p ? 'Edit print' : 'Log a print',
      '<div class="f"><label>Model</label><select id="pModel">'+modelOpts+'</select></div>'+
      '<div class="fr3">'+
        '<div class="f"><label>Date</label><input type="date" id="pDate" value="'+U.attr(p?p.date:U.today())+'"></div>'+
        '<div class="f"><label>Result</label><select id="pResult">'+
          RESULTS.map(r=>'<option value="'+r[0]+'"'+((p?p.result:'success')===r[0]?' selected':'')+'>'+r[1]+'</option>').join('')+'</select></div>'+
        '<div class="f"><label>Printer</label><input id="pPrinter" list="prnList" value="'+U.attr(p?p.printer:(Store.settings.defaultPrinter||est.printer||''))+'">'+
          '<datalist id="prnList">'+U.uniq(Store.printers.map(x=>x.name).concat(Store.prints.map(x=>x.printer)).filter(Boolean))
            .map(n=>'<option value="'+U.attr(n)+'">').join('')+'</datalist></div>'+
      '</div>'+
      '<div class="f"><label>Filament spool</label><select id="pFil" onchange="PV.Prints.onFil()">'+
        '<option value="">(not tracked)</option>'+
        Store.filaments.filter(f=>!f.archived).map(f=>'<option value="'+U.attr(f.id)+'"'+((p&&p.filamentId)===f.id?' selected':'')+'>'+
          U.esc(f.brand+' '+f.material+(f.colorName?' — '+f.colorName:'')+'  ('+U.num(f.remainingG,0)+'g left)')+'</option>').join('')+
        '</select></div>'+
      '<div class="fr3">'+
        '<div class="f"><label>Material</label><input id="pMaterial" list="matList" value="'+U.attr(p?p.material:(est.material||''))+'">'+
          '<datalist id="matList">'+MATERIALS.map(x=>'<option value="'+x+'">').join('')+'</datalist></div>'+
        '<div class="f"><label>Layer height (mm)</label><input type="number" step="0.01" id="pLayer" value="'+U.attr(p?p.layerH:(est.layerH||''))+'"></div>'+
        '<div class="f"><label>Nozzle (mm)</label><input type="number" step="0.05" id="pNozzle" value="'+U.attr(p?p.nozzle:(est.nozzle||''))+'"></div>'+
      '</div>'+
      '<div class="fr3">'+
        '<div class="f"><label>Filament used (g)</label><input type="number" step="0.1" id="pGrams" value="'+U.attr(p?p.grams:(est.grams?Math.round(est.grams*10)/10:''))+'"></div>'+
        '<div class="f"><label>Print time (minutes)</label><input type="number" step="1" id="pTime" value="'+U.attr(p?p.timeMin:(est.timeMin?Math.round(est.timeMin):''))+'"></div>'+
        '<div class="f"><label>Infill %</label><input type="number" step="1" id="pInfill" value="'+U.attr(p?p.infill:(est.infill||''))+'"></div>'+
      '</div>'+
      '<div class="f"><label>Notes</label><textarea id="pNotes" placeholder="Warped at the corners, next time raise bed temp to 65 and add a brim.">'+U.esc(p?p.notes||'':'')+'</textarea></div>'+
      (p ? '' : '<div class="note">Grams logged against a tracked spool are subtracted from what is left on it.</div>'),
      (p ? '<button class="b d" onclick="PV.Prints.del(\''+p.id+'\')">'+I.trash+' Delete</button>' : '')+
      '<div class="sp"></div>'+
      '<button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b p" onclick="PV.Prints.save('+(p?"'"+p.id+"'":'null')+')">'+(p?'Save':'Log print')+'</button>', 'wide');
  },

  onFil(){
    const f = Store.filament(Modal.val('pFil'));
    if(!f) return;
    const mat = document.getElementById('pMaterial');
    if(mat && !mat.value) mat.value = f.material || '';
  },

  async save(printId){
    const old = printId ? Store.prints.find(x=>x.id===printId) : null;
    const modelId = Modal.val('pModel');
    const m = Store.model(modelId);
    const p = Object.assign({id: printId || U.id('p'), createdAt: old?old.createdAt:Date.now()}, old || {}, {
      modelId, modelName: m ? m.name : (old ? old.modelName : ''),
      date: Modal.val('pDate') || U.today(),
      result: Modal.val('pResult'),
      printer: Modal.val('pPrinter').trim(),
      filamentId: Modal.val('pFil'),
      material: Modal.val('pMaterial').trim(),
      layerH: Modal.num('pLayer'),
      nozzle: Modal.num('pNozzle'),
      grams: Modal.num('pGrams'),
      timeMin: Modal.num('pTime'),
      infill: Modal.num('pInfill'),
      notes: Modal.val('pNotes')
    });
    // adjust spool balances
    if(old && old.filamentId){ const f = Store.filament(old.filamentId);
      if(f){ f.remainingG = (f.remainingG||0) + (old.grams||0); await Store.put('filaments', f); } }
    if(p.filamentId){ const f = Store.filament(p.filamentId);
      if(f){ f.remainingG = Math.max(0, (f.remainingG||0) - (p.grams||0)); await Store.put('filaments', f); } }
    await Store.put('prints', p);
    Modal.close();
    if(Detail.cur === modelId) Detail.open(modelId); else UI.render();
    Toast.ok(printId ? 'Print updated' : 'Print logged');
  },

  del(id){
    const p = Store.prints.find(x=>x.id===id); if(!p) return;
    Modal.confirm('Delete this print log?', 'The entry from '+U.date(p.date)+' will be removed. Filament used will be credited back to the spool.', async ()=>{
      if(p.filamentId){ const f = Store.filament(p.filamentId);
        if(f){ f.remainingG = (f.remainingG||0) + (p.grams||0); await Store.put('filaments', f); } }
      await Store.remove('prints', id);
      Modal.close();
      if(Detail.cur === p.modelId) Detail.open(p.modelId); else UI.render();
      Toast.ok('Print log deleted');
    }, 'Delete', true);
  }
};

const Filament = {
  render(v){

      '<th class="num">Nozzle</th><th class="num">Bed</th><th></th></tr></thead><tbody>';
    h += U.sortBy(list, f=>(f.archived?'z':'a')+(f.material||'')+(f.brand||''), 'asc').map(f=>{
      const pct = Filament.pct(f);
      const cls = pct < 15 ? 'low' : pct < 35 ? 'mid' : '';
      return '<tr'+(f.archived?' style="opacity:.5"':'')+'>'+
        '<td><span class="sw" style="background:'+U.attr(f.colorHex||'#888')+'"></span></td>'+
        '<td><b>'+U.esc(f.brand||'Unbranded')+'</b><br><span style="color:var(--dim2);font-size:11.5px">'+U.esc(f.material||'')+
          (f.diameter?' · '+f.diameter+'mm':'')+'</span></td>'+
        '<td style="font-size:12.5px">'+U.esc(f.colorName||'—')+'</td>'+
        '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i class="'+cls+'" style="width:'+pct+'%"></i></div>'+

        '<td class="num">'+U.num(f.remainingG,0)+'</td>'+

/* ============================================================
   Dupes — duplicate + cleanup finder
   ============================================================ */
const Dupes = {
  mode:'exact',
  sel:new Set(),

  /* Lower score wins the "keep" slot. The rules encode what a person would
     obviously pick, rather than guessing from timestamps alone. */
  keepScore(f){
    const base = U.base(f.path).toLowerCase();
    let s = 0;
    if(/[-_ ]copy(\s|\.|\)|$)/.test(base) || /\bcopy of\b/.test(base)) s += 1000;
    if(/\(\d+\)\s*\.[a-z0-9]+$/.test(base)) s += 1000;          // "thing (1).stl"
    if(/[-_ ]v?\d+\s*\.[a-z0-9]+$/.test(base) === false) s += 0;
    const prefer = String(Store.settings.keepPrefer||'').trim().toLowerCase();
    if(prefer && f.path.toLowerCase().indexOf(prefer) === 0) s -= 500;
    s += f.path.split('/').length * 10;                          // shallower wins
    s += f.path.length * 0.05;
    return s;
  },
  /* Order a group so the file to keep is first */
  ranked(files){
    return files.slice().sort((a,b)=>
      Dupes.keepScore(a) - Dupes.keepScore(b) || (a.mtime||0) - (b.mtime||0) || a.path.localeCompare(b.path));
  },
  selectedFiles(){
    return Array.from(Dupes.sel).map(id=>Store.file(id)).filter(Boolean);
  },
  selectAllExtras(groups){
    Dupes.sel.clear();
    groups.forEach(g=>Dupes.ranked(g.files).slice(1).forEach(f=>Dupes.sel.add(f.id)));
    UI.render();
  },
  clearSel(){ Dupes.sel.clear(); UI.render(); },
  toggle(id){ Dupes.sel.has(id) ? Dupes.sel.delete(id) : Dupes.sel.add(id); UI.render(); },
  toggleGroup(key){
    const g = Dupes.groups().concat(Dupes.nameGroups()).find(x=>x.key===key);
    if(!g) return;
    const extras = Dupes.ranked(g.files).slice(1);
    const allOn = extras.every(f=>Dupes.sel.has(f.id));
    extras.forEach(f=>allOn ? Dupes.sel.delete(f.id) : Dupes.sel.add(f.id));
    UI.render();
  },

  groups(){
    const byHash = new Map();
    Store.files.forEach(f=>{
      if(!f.sha) return;
      if(!byHash.has(f.sha)) byHash.set(f.sha, []);
      byHash.get(f.sha).push(f);
    });
    const out = [];
    byHash.forEach((list, sha)=>{ if(list.length > 1) out.push({key:sha, files:list, size:list[0].size,
      waste:(list.length-1)*list[0].size}); });
    return out.sort((a,b)=>b.waste - a.waste);
  },

  nameGroups(){
    const by = new Map();
    Store.files.forEach(f=>{
      if(f.size < 2048) return;
      const k = f.name.toLowerCase()+'|'+f.size;
      if(!by.has(k)) by.set(k, []);
      by.get(k).push(f);
    });
    const out = [];
    by.forEach((list,k)=>{
      if(list.length < 2) return;
      if(list.every(f=>f.sha) && U.uniq(list.map(f=>f.sha)).length === 1) return; // already covered by exact
      out.push({key:k, files:list, size:list[0].size, waste:(list.length-1)*list[0].size});
    });
    return out.sort((a,b)=>b.waste - a.waste);
  },

  archives(){
    const dirs = new Set();
    Store.files.forEach(f=>{ let d = U.dir(f.path); while(d){ dirs.add(f.rootId+'|'+d.toLowerCase()); d = U.dir(d); } });
    return Store.files.filter(f=>{
      if(f.kind !== 'arch') return false;
      const stem = U.stem(f.name).toLowerCase();
      const parent = U.dir(f.path);
      return dirs.has(f.rootId+'|'+(parent ? parent.toLowerCase()+'/'+stem : stem));
    }).sort((a,b)=>b.size - a.size);
  },

  render(v){
    const hashed = Store.files.filter(f=>f.sha).length;
    const exact = Dupes.groups(), similar = Dupes.nameGroups(), arch = Dupes.archives();
    const waste = exact.reduce((s,g)=>s+g.waste, 0);
    const archWaste = arch.reduce((s,f)=>s+f.size, 0);

    const selN = Dupes.sel.size;
    const selBytes = Dupes.selectedFiles().reduce((s,f)=>s+(f.size||0), 0);
    const quarantine = Store.settings.dupeAction !== 'delete';
    let h = '<div class="pv-bar"><h2>Duplicates &amp; Cleanup</h2><div class="sp"></div>'+
      (selN ? '<span class="cnt">'+selN+' selected · '+U.bytes(selBytes)+'</span>'+
              '<button class="b sm" onclick="PV.Dupes.clearSel()">Clear</button>'+
              '<button class="b sm '+(quarantine?'p':'d')+'" onclick="PV.Dupes.reviewSelected()">'+
                (quarantine ? I.folder+' Quarantine '+selN : I.trash+' Delete '+selN)+'</button>'
            : (exact.length || similar.length
               ? '<button class="b sm p" onclick="PV.Dupes.selectAll()">'+I.check+' Select all extras</button>' : ''))+
      '<button class="b sm" onclick="PV.Dupes.hash()">'+I.refresh+' Hash files</button></div>';

    h += '<div class="stats">'+
      '<div class="stat"><div class="k">Exact duplicates</div><div class="v">'+exact.length+'</div><div class="sub">groups by SHA-256</div></div>'+
      '<div class="stat"><div class="k">Reclaimable</div><div class="v" style="color:'+(waste?'var(--acc)':'inherit')+'">'+U.bytes(waste)+'</div><div class="sub">redundant copies</div></div>'+
      '<div class="stat"><div class="k">Same name + size</div><div class="v">'+similar.length+'</div><div class="sub">unverified, hash to confirm</div></div>'+
      '<div class="stat"><div class="k">Extracted archives</div><div class="v">'+arch.length+'</div><div class="sub">'+U.bytes(archWaste)+' in zips</div></div>'+
      '</div>';

    h += '<div class="seg" style="margin-bottom:14px;width:fit-content">'+
      [['exact','Exact ('+exact.length+')'],['similar','Same name ('+similar.length+')'],['arch','Archives ('+arch.length+')']]
      .map(m=>'<button class="'+(Dupes.mode===m[0]?'on':'')+'" onclick="PV.Dupes.setMode(\''+m[0]+'\')">'+m[1]+'</button>').join('')+'</div>';

    if(Dupes.mode === 'exact'){
      if(hashed === 0){
        h += '<div class="pv-empty">'+I.copy+'<h3>Nothing hashed yet</h3>'+
          '<p>To find byte-identical files, PrintVault reads and hashes them. It only hashes files that share an exact size with another file, so it skips almost everything.</p>'+
          '<button class="b p" onclick="PV.Dupes.hash()">'+I.refresh+' Hash candidate files</button></div>';
      } else if(!exact.length){
        h += '<div class="pv-empty">'+I.check+'<h3>No exact duplicates</h3><p>'+hashed.toLocaleString()+' files hashed, all unique.</p></div>';
      } else {
        h += '<div class="note">Files below are byte-identical. The first in each group is marked to keep. '+
             '<b>Deleting removes the file from disk permanently</b>, so check the paths first.</div>';
        h += exact.slice(0, 200).map(g=>Dupes.group(g, 'sha')).join('');
        if(exact.length > 200) h += '<div style="color:var(--dim2);font-size:12.5px;padding:8px">Showing the 200 largest groups of '+exact.length+'.</div>';
      }
    } else if(Dupes.mode === 'similar'){
      if(!similar.length) h += '<div class="pv-empty">'+I.check+'<h3>No name+size matches</h3><p>Nothing looks like an obvious copy.</p></div>';
      else {
        h += '<div class="note"><b>Not verified.</b> These files share a filename and byte size, which usually means a copy, but only hashing proves it. Run <b>Hash files</b> to confirm before deleting anything.</div>';
        h += similar.slice(0,150).map(g=>Dupes.group(g, 'name')).join('');
      }
    } else {
      if(!arch.length) h += '<div class="pv-empty">'+I.check+'<h3>No leftover archives</h3><p>No zip or rar files sitting next to a folder of the same name.</p></div>';
      else {
        h += '<div class="note">Each archive below has a sibling folder with the same name, so it was probably already extracted. Deleting the archive is usually safe, but PrintVault cannot look inside rar or 7z files to verify.</div>';

      '<dl class="kv" style="margin-bottom:12px"><dt>Files</dt><dd>'+files.length+'</dd>'+
      '<dt>Space</dt><dd>'+U.bytes(total)+'</dd>'+
      '<dt>Folders</dt><dd>'+U.esc(Object.keys(byRoot).map(k=>k+' ('+byRoot[k]+')').join(', '))+'</dd></dl>'+
      '<div style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg3)">'+
      files.slice(0,300).map(f=>'<div class="mono" style="font-size:11.5px;padding:3px 0;word-break:break-all;color:var(--dim)">'+
        U.esc((Store.root(f.rootId)||{}).name+'/'+f.path)+'</div>').join('')+
      (files.length>300 ? '<div style="color:var(--dim2);font-size:12px;padding-top:6px">...and '+(files.length-300)+' more</div>' : '')+
      '</div>',
      '<button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b '+(quarantine?'p':'d')+'" id="dupGo">'+
        (quarantine ? I.folder+' Move '+files.length+' to quarantine' : I.trash+' Delete permanently')+'</button>', 'wide');
    document.getElementById('dupGo').onclick = ()=>Dupes._run(files, quarantine);
  },

  del(id){ Dupes.delMany([id]); },
  delMany(ids){
    const files = ids.map(i=>Store.file(i)).filter(Boolean);
    if(!files.length) return;
    const total = files.reduce((s,f)=>s+(f.size||0), 0);
    Modal.open('Delete '+files.length+' file'+(files.length===1?'':'s')+'?',
      '<div class="note bad"><b>This permanently deletes files from your disk.</b> They do not go to the Recycle Bin and cannot be undone from here.</div>'+
      '<div style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg3)">'+
      files.slice(0,200).map(f=>'<div class="mono" style="font-size:11.5px;padding:3px 0;word-break:break-all;color:var(--dim)">'+
        U.esc((Store.root(f.rootId)||{}).name+'/'+f.path)+'</div>').join('')+
      (files.length>200 ? '<div style="color:var(--dim2);font-size:12px;padding-top:6px">...and '+(files.length-200)+' more</div>' : '')+
      '</div><p style="color:var(--dim);font-size:12.5px;margin:12px 0 0">Frees about <b>'+U.bytes(total)+'</b>.</p>',
      '<button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b d" id="dYes">'+I.trash+' Delete permanently</button>');
    document.getElementById('dYes').onclick = ()=>Dupes._run(files);
  },
  async _run(files, quarantine){
    Modal.close();
    const qdir = Store.settings.quarantineDir || '_PrintVault_quarantine';
    Prog.start(quarantine ? 'Moving to quarantine...' : 'Deleting files...');
    let ok = 0, fail = 0;
    const gone = [];
    for(let i=0;i<files.length;i++){
      if(Prog.cancelled) break;
      const f = files[i];
      Prog.set((quarantine?'Moving':'Deleting')+' ('+(i+1)+'/'+files.length+') '+f.name, i, files.length);
      try{
        if(quarantine) await FS.moveToQuarantine(f.rootId, f.path, qdir);
        else await FS.deleteFile(f.rootId, f.path);
        gone.push(f.id); ok++;
      }
      catch(e){ fail++; if(fail === 1) Toast.err((quarantine?'Move':'Delete')+' failed: '+e.message); }
    }
    if(gone.length){
      await DB.delMany('files', gone);
      const goneSet = new Set(gone);
      const touched = new Set(Store.files.filter(f=>goneSet.has(f.id)).map(f=>f.modelId));
      Store.files = Store.files.filter(f=>!goneSet.has(f.id));
      Store.reindex();
      const upd = [];
      touched.forEach(mid=>{
        const m = Store.model(mid); if(!m) return;
        const list = Store.modelFiles(mid);
        m.fileCount = list.length; m.bytes = list.reduce((s,f)=>s+(f.size||0),0);
        upd.push(m);
      });
      if(upd.length) await DB.putMany('models', upd);
    }
    Dupes.sel.clear();
    Prog.stop();
    UI.render();
    Toast.ok((quarantine ? 'Moved '+ok+' file'+(ok===1?'':'s')+' to '+qdir
                         : 'Deleted '+ok+' file'+(ok===1?'':'s'))+(fail?', '+fail+' failed':''));
  }
};

        m.n+' prints, '+U.num(m.g,0)+'g">'+

    h += '<div class="panel"><h3>'+I.print+' Most printed</h3>'+

        Array.from(byPrinter.entries()).sort((a,b)=>b[1].n-a[1].n).map(([k,x])=>
          '<tr><td>'+U.esc(k)+'</td><td class="num">'+x.n+'</td><td class="num">'+Math.round(x.ok/x.n*100)+'%</td><td class="num">'+U.num(x.t/60,0)+'</td></tr>').join('')+

    h += '<div class="panel"><h3>'+I.cube+' Largest models</h3><table class="t"><tbody>'+
      big.map(m=>'<tr><td><a href="#" onclick="event.preventDefault();PV.Detail.open(\''+m.id+'\')">'+U.esc(m.name)+'</a></td>'+
        '<td class="num">'+U.bytes(m.bytes)+'</td></tr>').join('')+'</tbody></table></div>';

    const tags = Store.allTags().slice(0,14);
    h += '<div class="panel"><h3>'+I.tag+' Top tags</h3>'+

        '<button class="b" onclick="PV.Settings.exportCSV()">'+I.dl+' Prints as CSV</button>'+
      '</div>'+
      (Store.parked.length ? '<div class="note" style="margin:12px 0 0">Tags and notes for <b>'+Store.parked.length+
        '</b> model'+(Store.parked.length===1?'':'s')+' are waiting for a folder that has not been scanned yet. '+
        'They attach on the next scan. <a href="#" onclick="PV.Settings.dropParked();return false">Discard them</a></div>' : '')+
      '</div>';

    h += '<div class="panel" style="border-color:rgba(255,96,96,.35)"><h3 style="color:var(--bad)">'+I.warn+' Danger zone</h3>'+
      '<p style="color:var(--dim);font-size:12.5px;line-height:1.65;margin:0 0 12px">These only affect the PrintVault '+
      (FS.kind === 'desktop' ? 'database on this machine' : 'database in this browser')+'. '+
      '<b>No files on disk are ever touched here.</b></p>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        '<button class="b d" onclick="PV.Settings.clearIndex()">Clear file index</button>'+
        '<button class="b d" onclick="PV.Settings.clearAll()">Erase everything</button></div></div>';

    h += '<div style="text-align:center;color:var(--dim2);font-size:12px;padding:20px 0 8px;line-height:1.7">'+
      '<b style="color:var(--dim)">PrintVault</b> v'+APP_VERSION+' &copy; 2026 '+
      '<a href="https://magikh0e.pl" target="_blank" rel="noopener noreferrer me">magikh0e</a><br>'+
      'Licensed under <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener noreferrer">GPL-3.0-or-later</a> · '+
      (FS.kind === 'desktop'
        ? 'desktop build '+U.esc(window.__PV_DESKTOP__||'')+' · everything stays on this machine'
        : 'browser build · everything stays in this browser · '+
          (FS.supported ? 'folder access available' : 'folder access unavailable'))+'</div>';

    v.innerHTML = h;
  },

  set(k, val){ Store.setting(k, val); if(k==='thumbSize') Toast.ok('New previews will use '+val+'px'); },
  theme(t){ Store.setting('theme', t); applyTheme(); UI.render(); },

  printer(id){
    const p = id ? Store.printer(id) : null;
    Modal.open(p ? 'Edit printer' : 'Add printer',
      '<div class="fr"><div class="f"><label>Name</label><input id="prName" value="'+U.attr(p?p.name:'')+'" placeholder="Workhorse"></div>'+
      '<div class="f"><label>Model</label><input id="prModel" value="'+U.attr(p?p.model:'')+'" placeholder="Prusa MK4S"></div></div>'+
      '<div class="fr3"><div class="f"><label>Bed X (mm)</label><input type="number" id="prX" value="'+U.attr(p?p.bedX:250)+'"></div>'+
      '<div class="f"><label>Bed Y (mm)</label><input type="number" id="prY" value="'+U.attr(p?p.bedY:210)+'"></div>'+
      '<div class="f"><label>Height Z (mm)</label><input type="number" id="prZ" value="'+U.attr(p?p.bedZ:220)+'"></div></div>'+
      '<div class="f" style="max-width:200px"><label>Nozzle (mm)</label><input type="number" step="0.05" id="prN" value="'+U.attr(p?p.nozzle:0.4)+'"></div>'+
      '<div class="f"><label>Notes</label><textarea id="prNotes">'+U.esc(p?p.notes||'':'')+'</textarea></div>',
      '<div class="sp"></div><button class="b" onclick="PV.Modal.back()">Cancel</button>'+
      '<button class="b p" onclick="PV.Settings.savePrinter('+(p?"'"+p.id+"'":'null')+')">Save</button>');
  },
  async savePrinter(id){
    const p = Object.assign({id: id||U.id('pr')}, (id?Store.printer(id):null)||{}, {
      name: Modal.val('prName').trim() || 'Printer', model: Modal.val('prModel').trim(),
      bedX: Modal.num('prX'), bedY: Modal.num('prY'), bedZ: Modal.num('prZ'),
      nozzle: Modal.num('prN'), notes: Modal.val('prNotes')
    });
    await Store.put('printers', p);
    Modal.close(); UI.render(); Toast.ok('Printer saved');
  },
  delPrinter(id){
    Modal.confirm('Delete printer?', 'Print logs keep the printer name as text.', async ()=>{
      await Store.remove('printers', id); Modal.close(); UI.render();
    }, 'Delete', true);
  },

  async regenAll(){
    const missing = Store.models.filter(m=>!m.thumbId);
    if(!missing.length) return Toast.ok('Every model already has a preview');
    Prog.start('Rebuilding previews...');
    await Scan.thumbnails(missing);
    Prog.stop(); UI.render();
    Toast.ok('Done, '+missing.filter(m=>m.thumbId).length+' of '+missing.length+' rendered');
  },

  exportJSON(){
    const data = {
      app:'PrintVault', version:APP_VERSION, exportedAt:new Date().toISOString(),
      settings: Store.settings,
      roots: Store.roots.map(r=>({id:r.id, name:r.name, addedAt:r.addedAt, lastScan:r.lastScan})),
      // rootName travels with each model: root ids are local to one install,
      // the folder name and relative path are what identify it anywhere else
      models: Store.models.map(m=>({id:m.id, rootId:m.rootId, rootName:(Store.root(m.rootId)||{}).name||'',
        path:m.path, name:m.name, tags:m.tags,
        collections:m.collections, source:m.source, creator:m.creator, license:m.license, notes:m.notes,
        rating:m.rating, favorite:m.favorite, createdAt:m.createdAt})),
      parked: Store.parked,   // metadata still waiting for a folder, don't lose it
      prints: Store.prints, filaments: Store.filaments, printers: Store.printers, queue: Store.queue
    };
    U.download('printvault-backup-'+U.today()+'.json',
      new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}));
    Toast.ok('Backup exported');
  },

  exportCSV(){
    const rows = [['Date','Model','Result','Printer','Filament','Material','Layer','Nozzle','Infill','Grams','Minutes','Cost','Notes']];
    U.sortBy(Store.prints, p=>p.date||'', 'desc').forEach(p=>{
      const m = Store.model(p.modelId), f = p.filamentId ? Store.filament(p.filamentId) : null;
      rows.push([p.date, m?m.name:(p.modelName||''), p.result, p.printer||'',
        f?(f.brand+' '+f.material+' '+(f.colorName||'')):'', p.material||'',
        p.layerH||'', p.nozzle||'', p.infill||'', p.grams||'', p.timeMin||'',
        (Prints.cost(p)||'').toString().slice(0,6), (p.notes||'').replace(/\s+/g,' ')]);
    });
    const csv = rows.map(r=>r.map(c=>{
      const s = String(c==null?'':c);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(',')).join('\r\n');
    U.download('printvault-prints-'+U.today()+'.csv', new Blob([csv], {type:'text/csv'}));
    Toast.ok('CSV exported');
  },

  importJSON(){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = async ()=>{
      const file = inp.files[0]; if(!file) return;
      let data;
      try{ data = JSON.parse(await file.text()); }catch(e){ return Toast.err('That is not valid JSON'); }
      if(!data || data.app !== 'PrintVault') return Toast.err('Not a PrintVault backup');
      Modal.confirm('Import backup?',
        'Adds <b>'+(data.prints||[]).length+'</b> prints, <b>'+(data.filaments||[]).length+'</b> spools, and metadata for <b>'+
        (data.models||[]).length+'</b> models. Existing entries with the same id are overwritten; nothing is deleted.',
        async ()=>{
          const rootName = {};
          (data.roots||[]).forEach(r=>{ rootName[r.id] = r.name; });

          // Park everything by folder name and path, then let it find its
          // models. Nothing is thrown away for want of a match: whatever
          // can't land now waits in the database for the next scan.
          const bm = (data.models||[]).concat(data.parked||[]);
          await Meta.park(bm.map(m=>Object.assign(
            {rootName:m.rootName||rootName[m.rootId]||'', path:m.path, name:m.name},
            Meta.FIELDS.reduce((o,f)=>(o[f]=m[f], o), {}))));

          for(const k of ['prints','filaments','printers','queue']){
            for(const x of (data[k]||[])) await Store.put(k, x);
          }
          if(data.settings) { Object.assign(Store.settings, data.settings); await Store.saveSettings(); }

          const mm = await Meta.adopt(Store.models);
          Modal.close(); applyTheme(); UI.render();

          const other = (data.prints||[]).length + (data.filaments||[]).length +
                        (data.printers||[]).length + (data.queue||[]).length;
          const held = Store.parked.length;
          if(mm) Toast.ok('Imported '+other+' records and restored metadata for '+mm+' model'+(mm===1?'':'s')+
                          (held ? '. '+held+' more will attach when you scan.' : '.'));
          else if(held) Toast.err('Imported '+other+' prints, spools, printers and queue entries. Tags and notes for '+
                          held+' models are saved and waiting: add the folder and scan it, and they will attach themselves.', 9000);
          else Toast.ok('Imported '+other+' records.');
        }, 'Import');
    };
    inp.click();
  },

  dropParked(){
    Modal.confirm('Discard waiting metadata?',
      'Throws away tags, collections and notes for <b>'+Store.parked.length+'</b> models that came from a backup '+
      'and have not found their files yet. Import the backup again to bring them back.',
      async ()=>{ await Meta.clear(); Modal.close(); UI.render(); Toast.ok('Discarded'); }, 'Discard', true);
  },

  clearIndex(){
    Modal.confirm('Clear the file index?',
      'Removes all indexed folders, models, files, and previews from the database. '+
      '<b>Print history, filament, printers, and the queue are kept.</b> No files on disk are touched. You can re-add folders and rescan.',
      async ()=>{
        await Promise.all([DB.clear('files'), DB.clear('models'), DB.clear('roots'), DB.clear('thumbs')]);
        Store.files=[]; Store.models=[]; Store.roots=[]; Store.reindex();
        Thumbs._urls.clear();
        Modal.close(); UI.render(); Toast.ok('Index cleared');
      }, 'Clear index', true);
  },
  clearAll(){
    Modal.confirm('Erase everything?',
      'Deletes the entire PrintVault database in this browser: index, print history, filament, printers, and queue. '+
      'This cannot be undone. <b>No files on disk are touched.</b> Export a backup first if you want one.',
      async ()=>{
        await Promise.all(STORES.map(s=>DB.clear(s)));
        location.reload();
      }, 'Erase everything', true);
  }
};

/* ============================================================
   Boot
   ============================================================ */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', Store.settings.theme || 'dark');
  document.getElementById('btnTheme').innerHTML = Store.settings.theme === 'light' ? I.moon : I.sun;
}

function wire(){
  document.getElementById('btnAddRoot').onclick = ()=>Scan.addRoot();
  document.getElementById('btnScan').onclick = ()=>{
    if(!Store.roots.length) return Scan.addRoot();
    Scan.run();
  };
  document.getElementById('btnTheme').onclick = ()=>{
    Store.setting('theme', Store.settings.theme === 'light' ? 'dark' : 'light');
    applyTheme(); UI.render();
  };
  const q = document.getElementById('q');
  q.addEventListener('input', U.debounce(()=>{
    UI.filter.q = q.value.trim();
    UI.page = 1;
    UI.render();
  }, 180));
  q.addEventListener('keydown', e=>{ if(e.key==='Escape'){ q.value=''; UI.filter.q=''; q.blur(); UI.render(); } });
  // Closing or reloading mid-job stops it. Progress is saved as it goes, but the
  // browser still needs to ask, since the rest of the job will not happen.
  window.addEventListener('beforeunload', e=>{
    if(!Scan.busy && !Prog._active) return;
    e.preventDefault();
    e.returnValue = '';
    return '';
  });

  window.addEventListener('hashchange', ()=>{
    const h = location.hash.replace('#','');
    if(TABS.some(t=>t.id===h) && h !== UI.tab) UI.go(h);
  });
}

async function checkPerms(){
  const stale = [];
  for(const r of Store.roots){
    if(!r.handle && !r.path){ stale.push(r.name); continue; }
    try{ if(!(await FS.granted(r))) stale.push(r.name); }
    catch(e){ stale.push(r.name); }
  }
  if(stale.length) Toast.show('Click Scan to reconnect '+stale.length+' folder'+(stale.length===1?'':'s')+
    ' ('+stale.slice(0,3).join(', ')+'). Browsers require a click to restore folder access.', null, 7000);
}

(async function boot(){
  // The engine is worth showing at a glance: it decides whether folder access
  // is native or goes through the browser, which is the first thing to ask
  // about when something behaves unexpectedly.
  document.getElementById('verTag').textContent =
    'v'+APP_VERSION + (FS.kind === 'desktop' ? ' · desktop' : '');
  try{
    await DB.open();
    await Store.load();
  }catch(e){
    Toast.err('Database failed to open: '+e.message);
  }
  applyTheme();
  wire();
  const h = location.hash.replace('#','');
  if(TABS.some(t=>t.id===h)) UI.tab = h;
  document.querySelectorAll('.pv-view').forEach(v=>v.classList.toggle('on', v.id === 'v-'+UI.tab));
  UI.render();
  checkPerms();
  if(!FS.supported || !FS.secure){
    document.getElementById('btnAddRoot').classList.add('hidden');
    document.getElementById('btnScan').classList.add('hidden');
  }
})();

window.PV = {U, I, DB, Store, Toast, Prog, Modal, FS, Scan, Meta, Render, Thumbs, Work,
  UI, Library, Detail, Viewer, Archive, Prints, Filament, Queue, Dupes, Stats, Settings, APP_VERSION};


})();
</script>
