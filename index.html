  cad:   ['step','stp','iges','igs','f3d','f3z','scad','sldprt','ipt','dxf','svg','blend'],
  gcode: ['gcode','gco','g','bgcode','ufp','gx','mgcode'],
  image: ['png','jpg','jpeg','webp','gif','bmp','avif'],
  doc:   ['txt','md','pdf','nfo','html','htm','rtf','doc','docx','json','ini','cfg'],
  arch:  ['zip','rar','7z','tar','gz','lzma']
};
const EXT_KIND = (function(){ const m={}; for(const k in KIND) KIND[k].forEach(e=>m[e]=k); return m; })();
function kindOf(ext){ return EXT_KIND[ext] || 'other'; }
/* Bumped whenever the scanner learns to extract something new from a file.
   Records stamped with an older value get re-read on the next scan, so an app
   update does not silently skip files that were already indexed. */
const META_V = 2;
function isPrintable(ext){ const k=kindOf(ext); return k==='mesh'||k==='gcode'||k==='cad'; }

/* Folder names that are containers or variants, not model names of their own */
const GENERIC_DIRS = new Set(['files','file','stl','stls','3mf','3mfs','gcode','gcodes','print','prints','printable','printables',
  'parts','part','models','model','mesh','meshes','source','sources','src','download','downloads','extracted','unzipped',
  'output','out','export','exports','archive','new folder','untitled','images','img','pics','photos','renders','misc','other','assets',
  'supported','supports','support','presupported','pre-supported','unsupported','no supports','nosupports',
  'split','whole','solid','hollow','scaled','variants','variant','lys','chitubox','ams','no ams']);

/* ============================================================
   WORKER — hashing + mesh parsing + zip + gcode metadata
   ============================================================ */
function pvWorkerMain(){
  const td = new TextDecoder();

  function hex(buf){
    const b = new Uint8Array(buf); let s='';
    for(let i=0;i<b.length;i++) s += b[i].toString(16).padStart(2,'0');
    return s;
  }
  async function sha256(buf){ return hex(await crypto.subtle.digest('SHA-256', buf)); }

  /* ---- flat normals ---- */
  function flatNormals(pos){
    const n = new Float32Array(pos.length);
    for(let i=0;i<pos.length;i+=9){
      const ax=pos[i],ay=pos[i+1],az=pos[i+2];
      const bx=pos[i+3],by=pos[i+4],bz=pos[i+5];
      const cx=pos[i+6],cy=pos[i+7],cz=pos[i+8];
      const ux=bx-ax,uy=by-ay,uz=bz-az, vx=cx-ax,vy=cy-ay,vz=cz-az;
      let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
      const l=Math.hypot(nx,ny,nz)||1; nx/=l; ny/=l; nz/=l;
      for(let j=0;j<3;j++){ n[i+j*3]=nx; n[i+j*3+1]=ny; n[i+j*3+2]=nz; }
    }
    return n;
  }
  function bounds(pos){
    let mnx=Infinity,mny=Infinity,mnz=Infinity,mxx=-Infinity,mxy=-Infinity,mxz=-Infinity;
    for(let i=0;i<pos.length;i+=3){
      const x=pos[i],y=pos[i+1],z=pos[i+2];
      if(x<mnx)mnx=x; if(y<mny)mny=y; if(z<mnz)mnz=z;
      if(x>mxx)mxx=x; if(y>mxy)mxy=y; if(z>mxz)mxz=z;
    }
    if(!isFinite(mnx)) return null;
    return {min:[mnx,mny,mnz], max:[mxx,mxy,mxz], size:[mxx-mnx, mxy-mny, mxz-mnz]};
  }

  /* ---- STL ---- */
  function stlBinary(dv, n, maxTri){
    const step = maxTri && n>maxTri ? Math.ceil(n/maxTri) : 1;
    const cnt = Math.ceil(n/step);
    const pos = new Float32Array(cnt*9), nrm = new Float32Array(cnt*9);
    let w=0;
    for(let t=0;t<n;t+=step){
      const o = 84 + t*50;
      const nx=dv.getFloat32(o,true), ny=dv.getFloat32(o+4,true), nz=dv.getFloat32(o+8,true);
      for(let v=0;v<3;v++){
        const p = o+12+v*12;
        pos[w]=dv.getFloat32(p,true); pos[w+1]=dv.getFloat32(p+4,true); pos[w+2]=dv.getFloat32(p+8,true);
        nrm[w]=nx; nrm[w+1]=ny; nrm[w+2]=nz;
        w+=3;
      }
    }
    const bad = !isFinite(nrm[0]) || (nrm[0]===0&&nrm[1]===0&&nrm[2]===0);
    return {pos, nrm: bad ? flatNormals(pos) : nrm, tris:n};
  }
  function stlAscii(text, maxTri){
    const re = /vertex\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)/g;
    const arr = []; let m;
    while((m = re.exec(text))) arr.push(+m[1], +m[2], +m[3]);
    let pos = new Float32Array(arr);
    const tris = Math.floor(pos.length/9);
    if(maxTri && tris>maxTri){
      const step = Math.ceil(tris/maxTri), out = new Float32Array(Math.ceil(tris/step)*9);
      let w=0; for(let t=0;t<tris;t+=step){ out.set(pos.subarray(t*9,t*9+9), w); w+=9; }
      pos = out.subarray(0,w);
    }
    return {pos, nrm: flatNormals(pos), tris};
  }
  function parseSTL(buf, maxTri){
    const dv = new DataView(buf);
    if(buf.byteLength >= 84){
      const n = dv.getUint32(80, true);
      if(84 + n*50 === buf.byteLength) return stlBinary(dv, n, maxTri);
    }
    const head = td.decode(new Uint8Array(buf, 0, Math.min(256, buf.byteLength)));
    if(/^\s*solid/i.test(head) && /facet|vertex/i.test(head + td.decode(new Uint8Array(buf, 0, Math.min(4096, buf.byteLength)))))
      return stlAscii(td.decode(new Uint8Array(buf)), maxTri);
    if(buf.byteLength >= 84){
      const n = dv.getUint32(80, true);
      if(n>0 && 84 + n*50 <= buf.byteLength) return stlBinary(dv, n, maxTri);
    }
    throw new Error('Unrecognized STL');
  }

  /* ---- OBJ ---- */
  function parseOBJ(text, maxTri){
    const verts=[], out=[];
    const lines = text.split(/\r?\n/);
    for(let i=0;i<lines.length;i++){
      const L = lines[i];
      if(L.charCodeAt(0)===118 && L.charCodeAt(1)===32){ // "v "
        const p = L.split(/\s+/); verts.push(+p[1], +p[2], +p[3]);
      } else if(L.charCodeAt(0)===102 && L.charCodeAt(1)===32){ // "f "
        const p = L.trim().split(/\s+/), idx=[];
        for(let j=1;j<p.length;j++){
          let k = parseInt(p[j], 10);
          if(!isFinite(k)) continue;
          if(k<0) k = verts.length/3 + k; else k -= 1;
          idx.push(k);
        }
        for(let j=1;j+1<idx.length;j++){
          [idx[0], idx[j], idx[j+1]].forEach(k=>{ out.push(verts[k*3], verts[k*3+1], verts[k*3+2]); });
        }
      }
    }
    let pos = new Float32Array(out);
    const tris = Math.floor(pos.length/9);
    if(maxTri && tris>maxTri){
      const step=Math.ceil(tris/maxTri), o2=new Float32Array(Math.ceil(tris/step)*9);
      let w=0; for(let t=0;t<tris;t+=step){ o2.set(pos.subarray(t*9,t*9+9), w); w+=9; }
      pos = o2.subarray(0,w);
    }
    return {pos, nrm: flatNormals(pos), tris};
  }

  /* ---- ZIP (3MF containers) ---- */
  async function inflateRaw(u8){
    const st = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(st).arrayBuffer());
  }
  /* `base` is the absolute file offset of buf[0], so the same parser works on a
     tail slice. Throws NEEDMORE:<bytes> when the central directory starts before
     the slice, telling the caller how much of the tail to re-read. */
  function readZip(buf, base){
    base = base || 0;
    const dv = new DataView(buf), u8 = new Uint8Array(buf), len = buf.byteLength;
    let eocd = -1;
    for(let i = len - 22; i >= 0; i--){
      if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
    }
    if(eocd < 0) throw new Error(base ? 'NEEDMORE:' + Math.min(len * 4, 4194304) : 'Not a zip archive');
    let count = dv.getUint16(eocd+10, true), cdOff = dv.getUint32(eocd+16, true);
    if(cdOff === 0xffffffff || count === 0xffff){
      const loc = eocd - 20;
      if(loc >= 0 && dv.getUint32(loc, true) === 0x07064b50){
        const z = Number(dv.getBigUint64(loc+8, true));
        if(dv.getUint32(z, true) === 0x06064b50){
          count = Number(dv.getBigUint64(z+32, true));
          cdOff = Number(dv.getBigUint64(z+48, true));
        }
      }
    }
    if(cdOff < base) throw new Error('NEEDMORE:' + ((base + len) - cdOff + 1024));
    const entries = []; let p = cdOff - base;
    for(let i=0;i<count && p+46 <= len;i++){
      if(dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p+10, true);
      const crc = dv.getUint32(p+16, true);
      let csize = dv.getUint32(p+20, true), usize = dv.getUint32(p+24, true);
      const nlen = dv.getUint16(p+28, true), elen = dv.getUint16(p+30, true), clen = dv.getUint16(p+32, true);
      let lho = dv.getUint32(p+42, true);
      const name = td.decode(u8.subarray(p+46, p+46+nlen));
      if(csize === 0xffffffff || usize === 0xffffffff || lho === 0xffffffff){
        let e = p+46+nlen; const end = e+elen;
        while(e+4 <= end){
          const hid = dv.getUint16(e, true), hsz = dv.getUint16(e+2, true);
          if(hid === 0x0001){
            let q = e+4;
            if(usize === 0xffffffff){ usize = Number(dv.getBigUint64(q, true)); q+=8; }
            if(csize === 0xffffffff){ csize = Number(dv.getBigUint64(q, true)); q+=8; }
            if(lho === 0xffffffff){ lho = Number(dv.getBigUint64(q, true)); }
            break;
          }
          e += 4 + hsz;
        }
      }
      entries.push({name, method, csize, usize, lho, crc});
      p += 46 + nlen + elen + clen;
    }
    return {dv, u8, entries, base};
  }
  async function zipRead(z, entry){
    const {dv, u8} = z, lho = entry.lho - (z.base || 0);
    if(lho < 0) throw new Error('Entry data is outside the loaded slice');
    if(dv.getUint32(lho, true) !== 0x04034b50) throw new Error('Bad local header');
    const nlen = dv.getUint16(lho+26, true), elen = dv.getUint16(lho+28, true);
    const off = lho + 30 + nlen + elen;
    const raw = u8.subarray(off, off + entry.csize);
    if(entry.method === 0) return raw;
    if(entry.method === 8) return await inflateRaw(raw);
    throw new Error('Unsupported zip method ' + entry.method);
  }

  /* ---- 3MF ---- */
  const NUMS = /-?\d+(?:\.\d+)?(?:[eE][-+]?\d+)?/g;
  /* Compose two 3MF transforms: apply `c` first, then `i` */
  function mul12(c, i){
    if(!c) return i || null;
    if(!i) return c;
    const A = (m,r,k)=>m[r*3+k], o = new Array(12);
    for(let r=0;r<3;r++) for(let k=0;k<3;k++)
      o[r*3+k] = A(c,r,0)*A(i,0,k) + A(c,r,1)*A(i,1,k) + A(c,r,2)*A(i,2,k);
    for(let k=0;k<3;k++)
      o[9+k] = c[9]*A(i,0,k) + c[10]*A(i,1,k) + c[11]*A(i,2,k) + i[9+k];
    return o;
  }
  function parseMat(s){
    if(!s) return null;
    const n = s.trim().split(/\s+/).map(Number);
    return (n.length >= 12 && n.every(isFinite)) ? n : null;
  }

  function parse3MFModel(text, maxTri){
    const objs = {};
    let i = 0;
    while((i = text.indexOf('<object', i)) >= 0){
      const te = text.indexOf('>', i); if(te < 0) break;
      const head = text.slice(i, te);
      const idm = head.match(/\sid="([^"]*)"/);
      const close = text.indexOf('</object>', te);
      const body = text.slice(te, close < 0 ? text.length : close);
      const vre = /<vertex[^>]*\sx="([^"]*)"[^>]*\sy="([^"]*)"[^>]*\sz="([^"]*)"/g;
      const tre = /<triangle[^>]*\sv1="(\d+)"[^>]*\sv2="(\d+)"[^>]*\sv3="(\d+)"/g;
      const cre = /<component\b([^>]*)>/g;
      const vs = [], ts = [], comps = []; let m;
      while((m = vre.exec(body))) vs.push(+m[1], +m[2], +m[3]);
      while((m = tre.exec(body))) ts.push(+m[1], +m[2], +m[3]);
      // Slicers split geometry across parts and reference it by component
      while((m = cre.exec(body))){
        const oid = (m[1].match(/objectid="([^"]*)"/)||[])[1];
        if(oid) comps.push({oid, mat: parseMat((m[1].match(/transform="([^"]*)"/)||[])[1])});
      }
      if(idm){
        const id = idm[1], prev = objs[id];
        // never let a reference-only object shadow one that carries real geometry
        if(!prev || (!prev.ts.length && ts.length)) objs[id] = {vs, ts, comps};
      }
      i = close < 0 ? text.length : close + 9;
    }

    const items = [];
    const bStart = text.indexOf('<build');
    if(bStart >= 0){
      const bBody = text.slice(bStart, (text.indexOf('</build>', bStart)+1) || text.length);
      const ire = /<item\b([^>]*)>/g; let m;
      while((m = ire.exec(bBody))){
        const oid = (m[1].match(/objectid="([^"]*)"/)||[])[1];
        if(oid) items.push({oid, mat: parseMat((m[1].match(/transform="([^"]*)"/)||[])[1])});
      }
    }
    const use = items.length ? items : Object.keys(objs).map(k=>({oid:k, mat:null}));

    // follow component references down to the objects that actually hold meshes
    const leaves = [];
    const walk = (oid, mat, depth)=>{
      if(depth > 8) return;
      const o = objs[oid]; if(!o) return;
      if(o.ts.length) leaves.push({o, mat});
      for(const c of o.comps) walk(c.oid, mul12(c.mat, mat), depth + 1);
    };
    use.forEach(it=>walk(it.oid, it.mat, 0));

    let total = 0;
    leaves.forEach(l=>{ total += l.o.ts.length/3; });
    if(!total) throw new Error('No mesh in 3MF');
    const step = maxTri && total > maxTri ? Math.ceil(total/maxTri) : 1;
    const pos = new Float32Array(Math.ceil(total/step)*9);
    let w = 0, t = 0;
    leaves.forEach(l=>{
      const o = l.o, M = l.mat;
      for(let k=0;k<o.ts.length;k+=3, t++){
        if(t % step) continue;
        for(let v=0;v<3;v++){
          const vi = o.ts[k+v]*3;
          let x = o.vs[vi], y = o.vs[vi+1], z = o.vs[vi+2];
          if(M){
            const nx = x*M[0] + y*M[3] + z*M[6] + M[9];
            const ny = x*M[1] + y*M[4] + z*M[7] + M[10];
            const nz = x*M[2] + y*M[5] + z*M[8] + M[11];
            x=nx; y=ny; z=nz;
          }
          pos[w++]=x; pos[w++]=y; pos[w++]=z;
        }
      }
    });
    const p = pos.subarray(0, w);
    return {pos:p, nrm: flatNormals(p), tris: total};
  }

  async function parse3MF(buf, maxTri, wantThumb, forceMesh){
    const z = readZip(buf);
    let thumb = null;
    if(wantThumb){
      const cands = z.entries.filter(e=>/\.(png|jpe?g)$/i.test(e.name) &&
        /thumbnail|plate|preview|top_?\d*\.png/i.test(e.name) && !/pick_|_small|no_light/i.test(e.name));
      cands.sort((a,b)=>b.usize - a.usize);
      if(cands.length){ try{ thumb = await zipRead(z, cands[0]); }catch(e){} }
    }
    let mesh = null;
    const me = z.entries.find(e=>/3dmodel\.model$/i.test(e.name)) || z.entries.find(e=>/\.model$/i.test(e.name));
    if(me && (forceMesh || !thumb)){
      try{
        let text = td.decode(await zipRead(z, me));
        // Creality Print, OrcaSlicer and Bambu Studio keep the geometry in
        // separate 3D/Objects/*.model parts, leaving 3dmodel.model as an index.
        if(!/<vertex/i.test(text)){
          const parts = z.entries.filter(e=>/^3D\/Objects\/.*\.model$/i.test(e.name));
          let merged = '';
          for(const p of parts){ try{ merged += td.decode(await zipRead(z, p)); }catch(e){} }
          if(merged) text = merged + text;
        }
        mesh = parse3MFModel(text, maxTri);
      }catch(e){}
    }
    // slicer project metadata
    let cfg = null;
    const ce = z.entries.find(e=>/Slic3r_PE\.config|Metadata\/.*config|project_settings\.config/i.test(e.name));
    if(ce){ try{ cfg = td.decode(await zipRead(z, ce)).slice(0, 40000); }catch(e){} }
    return {thumb, mesh, cfg, names: z.entries.map(e=>e.name)};
  }

  /* ---- gcode ---- */
  function parseGcode(head, tail){
    const text = head + '\n' + tail;
    const g = {};
    const pick = (re, cast)=>{ const m = text.match(re); if(m){ const v = cast ? cast(m[1]) : m[1].trim(); if(v!=null && v!=='' && !(typeof v==='number' && !isFinite(v))) return v; } return null; };
    const f = s=>parseFloat(String(s).replace(/[^0-9.\-]/g,''));

    const trimSlicer = s=>String(s).replace(/\s+on\s+\d{4}-\d{2}-\d{2}.*$/i,'').trim();
    g.slicer = pick(/;\s*generated by\s+([^\n,]+)/i, trimSlicer) || pick(/;\s*Generated with\s+([^\n]+)/i, trimSlicer) || (/;FLAVOR:/.test(text) ? 'Cura' : null);
    g.grams  = pick(/;\s*filament used \[g\]\s*=\s*([\d.]+)/i, f);
    if(g.grams == null) g.grams = pick(/;\s*Filament\s+used.*?=\s*([\d.]+)\s*g/i, f);
    if(g.grams == null) g.grams = pick(/;\s*total filament used \[g\]\s*=\s*([\d.]+)/i, f);
    g.mm     = pick(/;\s*filament used \[mm\]\s*=\s*([\d.]+)/i, f);
    if(g.mm == null){ const cm = pick(/;Filament used:\s*([\d.]+)m/i, f); if(cm != null) g.mm = cm*1000; }
    g.cost   = pick(/;\s*filament cost\s*=\s*([\d.]+)/i, f);
    g.layerH = pick(/;\s*layer_height\s*=\s*([\d.]+)/i, f) || pick(/;Layer height:\s*([\d.]+)/i, f) || pick(/;\s*LAYER_HEIGHT:\s*([\d.]+)/i, f);
    g.nozzle = pick(/;\s*nozzle_diameter\s*=\s*([\d.]+)/i, f);
    g.infill = pick(/;\s*fill_density\s*=\s*([\d.]+)/i, f) || pick(/;\s*sparse_infill_density\s*=\s*([\d.]+)/i, f);
    g.material = pick(/;\s*filament_type\s*=\s*([A-Za-z0-9+ ]+)/i, s=>s.trim().split(/[;,]/)[0]) || pick(/;\s*material_type\s*=\s*(\w+)/i);
    g.printer  = pick(/;\s*printer_model\s*=\s*([^\n]+)/i) || pick(/;\s*printer_settings_id\s*=\s*([^\n]+)/i) || pick(/;\s*TARGET_MACHINE\.NAME:\s*([^\n]+)/i);
    g.profile  = pick(/;\s*print_settings_id\s*=\s*([^\n]+)/i);
    g.nozzleT  = pick(/;\s*(?:temperature|nozzle_temperature)\s*=\s*(\d+)/i, f);
    g.bedT     = pick(/;\s*(?:bed_temperature|hot_plate_temp)\s*=\s*(\d+)/i, f);

    let t = null;
    // PrusaSlicer "; estimated printing time (normal mode) = 2h 22m 8s"
    // OrcaSlicer/Bambu "; total estimated time: 4h 12m 30s"
    const pt = text.match(/;\s*(?:total\s+)?estimated\s+(?:printing\s+)?time[^=:\n]*[=:]\s*([^\n]+)/i);
    if(pt){
      const s = pt[1];
      let mins = 0, any = false;
      const dm = s.match(/(\d+)\s*d/); if(dm){ mins += +dm[1]*1440; any = true; }
      const hm = s.match(/(\d+)\s*h/); if(hm){ mins += +hm[1]*60; any = true; }
      const mm = s.match(/(\d+)\s*m(?!s)/); if(mm){ mins += +mm[1]; any = true; }
      const sm = s.match(/(\d+)\s*s/); if(sm){ mins += +sm[1]/60; any = true; }
      if(any) t = mins;
    }
    if(t == null){ const c = text.match(/;TIME:\s*(\d+)/i); if(c) t = +c[1]/60; }
    g.timeMin = t;

    // Cura and friends only report length. Estimate mass from volume x density.
    if(g.grams == null && g.mm){
      const dens = {PLA:1.24,'PLA+':1.24,'PLA-CF':1.29,PETG:1.27,'PETG-CF':1.31,ABS:1.04,ASA:1.07,
                    TPU:1.21,NYLON:1.14,PA:1.14,'PA-CF':1.19,PC:1.20,PVA:1.23,HIPS:1.04};
      const d = dens[String(g.material||'PLA').toUpperCase()] || 1.24;
      const dia = g.diameter || 1.75;
      const cm3 = Math.PI * Math.pow(dia/2, 2) * g.mm / 1000;
      g.grams = Math.round(cm3 * d * 10) / 10;
      g.gramsEstimated = true;
    }

    // embedded thumbnail (PrusaSlicer / OrcaSlicer / SuperSlicer)
    const ti = text.search(/;\s*thumbnail(?:_JPG)? begin/i);
    if(ti >= 0){
      const seg = text.slice(ti);
      const end = seg.search(/;\s*thumbnail(?:_JPG)? end/i);
      if(end > 0){
        const body = seg.slice(seg.indexOf('\n'), end);
        const b64 = body.split('\n').map(l=>l.replace(/^\s*;\s?/,'').trim()).join('');
        if(b64.length > 100) g.thumbB64 = b64.replace(/[^A-Za-z0-9+/=]/g,'');
      }
    }
    for(const k in g) if(g[k] == null) delete g[k];
    return g;
  }

  /* ---- dispatch ---- */
  self.onmessage = async function(e){
    const {id, op, buf, maxTri, head, tail, entry} = e.data;
    try{
      let out = {}, tr = [];
      if(op === 'hash'){
        out = {sha: await sha256(buf)};
      } else if(op === 'mesh'){
        const ext = e.data.ext;
        let r;
        if(ext === 'stl') r = parseSTL(buf, maxTri);
        else if(ext === 'obj') r = parseOBJ(td.decode(new Uint8Array(buf)), maxTri);
        else if(ext === '3mf'){
          const p = await parse3MF(buf, maxTri, true, !!e.data.needMesh);
          if(p.thumb){ out.thumbBytes = p.thumb; tr.push(p.thumb.buffer); }
          if(p.cfg) out.cfg = p.cfg;
          r = p.mesh;
        } else throw new Error('Unsupported mesh type: ' + ext);
        if(r){
          out.pos = r.pos; out.nrm = r.nrm; out.tris = r.tris; out.bbox = bounds(r.pos);
          tr.push(r.pos.buffer, r.nrm.buffer);
        }
      } else if(op === 'gcode'){
        out = {g: parseGcode(head || '', tail || '')};
      } else if(op === 'zipnames'){
        out = {entries: readZip(buf, e.data.base).entries
          .filter(x=>!/\/$/.test(x.name))
          .map(x=>({name:x.name, size:x.usize, csize:x.csize, method:x.method, lho:x.lho, crc:x.crc}))};
      } else if(op === 'zipmesh'){
        const z = readZip(buf);
        const ent = z.entries.find(x=>x.name === entry);
        if(!ent) throw new Error('Entry not found in archive');
        const bytes = await zipRead(z, ent);
        const ab = (bytes.byteOffset === 0 && bytes.byteLength === bytes.buffer.byteLength)
          ? bytes.buffer
          : bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
        const ex = (ent.name.split('.').pop() || '').toLowerCase();
        let r;
        if(ex === 'stl') r = parseSTL(ab, maxTri);
        else if(ex === 'obj') r = parseOBJ(td.decode(bytes), maxTri);
        else if(ex === '3mf') r = (await parse3MF(ab, maxTri, false)).mesh;
        else throw new Error('Not a mesh file: ' + ent.name);
        if(!r || !r.pos.length) throw new Error('No geometry in ' + ent.name);
        out.pos = r.pos; out.nrm = r.nrm; out.tris = r.tris; out.bbox = bounds(r.pos);
        tr.push(r.pos.buffer, r.nrm.buffer);
      } else throw new Error('Unknown op ' + op);
      self.postMessage({id, ok:true, out}, tr);
    }catch(err){
      self.postMessage({id, ok:false, error: String(err && err.message || err)});
    }
  };
}

const Work = {
  _w:null, _n:0, _pend:new Map(),
  get w(){
    if(!Work._w){
      const src = '(' + pvWorkerMain.toString() + ')()';
      Work._w = new Worker(URL.createObjectURL(new Blob([src], {type:'text/javascript'})));
      Work._w.onmessage = e=>{
        const {id, ok, out, error} = e.data;
        const p = Work._pend.get(id); if(!p) return;
        Work._pend.delete(id);
        ok ? p.res(out) : p.rej(new Error(error));
      };
      Work._w.onerror = e=>{ console.error('worker', e); };
    }
    return Work._w;
  },
  call(msg, transfer){
    const id = ++Work._n;
    return new Promise((res,rej)=>{
      Work._pend.set(id, {res,rej});
      Work.w.postMessage(Object.assign({id}, msg), transfer || []);
      setTimeout(()=>{ if(Work._pend.has(id)){ Work._pend.delete(id); rej(new Error('Worker timeout')); } }, 120000);
    });
  }
};

/* ============================================================
   Render — WebGL thumbnail generator
   ============================================================ */
const Render = {
  _gl:null, _cv:null, _prog:null, _size:0,
  init(w, h){
    if(Render._gl && Render._size === w+'x'+h) return Render._gl;
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const gl = cv.getContext('webgl', {antialias:true, preserveDrawingBuffer:true, alpha:true});
    if(!gl) throw new Error('WebGL unavailable');
    const vs = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs, 'attribute vec3 p;attribute vec3 n;uniform mat4 mvp;uniform mat4 mv;varying vec3 vn;varying float vd;'+
      'void main(){vec4 e=mv*vec4(p,1.0);vn=normalize(mat3(mv)*n);vd=-e.z;gl_Position=mvp*vec4(p,1.0);}');
    gl.compileShader(vs);
    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, 'precision mediump float;varying vec3 vn;varying float vd;uniform vec3 base;uniform vec2 dr;'+
      'void main(){vec3 N=normalize(vn);if(!gl_FrontFacing)N=-N;'+
      'float k=max(dot(N,normalize(vec3(0.32,0.42,0.85))),0.0);'+
      'float f=max(dot(N,normalize(vec3(-0.5,-0.3,0.4))),0.0)*0.22;'+
      'float rim=pow(1.0-max(N.z,0.0),2.5)*0.30;'+
      'float dep=clamp((dr.y-vd)/max(dr.y-dr.x,0.0001),0.0,1.0);'+
      'vec3 c=base*(0.24+0.70*k+f)+vec3(rim*0.9,rim*0.75,rim*0.6);'+
      'c*=mix(0.72,1.06,dep);gl_FragColor=vec4(c,1.0);}');
    gl.compileShader(fs);
    const pr = gl.createProgram();
    gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error('Shader link failed: ' + gl.getProgramInfoLog(pr));
    gl.useProgram(pr);
    gl.enable(gl.DEPTH_TEST);
    Render._gl = gl; Render._cv = cv; Render._prog = pr; Render._size = w+'x'+h;
    return gl;
  },
  _lookAt(eye, ctr, up){
    const z = [eye[0]-ctr[0], eye[1]-ctr[1], eye[2]-ctr[2]];
    let l = Math.hypot(z[0],z[1],z[2])||1; z[0]/=l; z[1]/=l; z[2]/=l;
    let x = [up[1]*z[2]-up[2]*z[1], up[2]*z[0]-up[0]*z[2], up[0]*z[1]-up[1]*z[0]];
    l = Math.hypot(x[0],x[1],x[2])||1; x[0]/=l; x[1]/=l; x[2]/=l;
    const y = [z[1]*x[2]-z[2]*x[1], z[2]*x[0]-z[0]*x[2], z[0]*x[1]-z[1]*x[0]];
    return new Float32Array([
      x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
      -(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]),
      -(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]),
      -(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]), 1]);
  },
  _ortho(rx, ry, n, f){
    return new Float32Array([1/rx,0,0,0, 0,1/ry,0,0, 0,0,-2/(f-n),0, 0,0,-(f+n)/(f-n),1]);
  },
  _mul(a,b){
    const o = new Float32Array(16);
    for(let i=0;i<4;i++) for(let j=0;j<4;j++){
      let s=0; for(let k=0;k<4;k++) s += a[k*4+j]*b[i*4+k];
      o[i*4+j]=s;
    }
    return o;
  },
  draw(pos, nrm, bbox, opt){
    opt = opt || {};
    const W = opt.size || 320, H = opt.height || Math.round(W * 0.75);
    const gl = Render.init(W, H);
    const pr = Render._prog;
    gl.viewport(0,0,W,H);
    const bgc = opt.bg || [0.086,0.098,0.122];
    gl.clearColor(bgc[0], bgc[1], bgc[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    const ctr = [(bbox.min[0]+bbox.max[0])/2, (bbox.min[1]+bbox.max[1])/2, (bbox.min[2]+bbox.max[2])/2];
    const rad = Math.max(1e-3, Math.hypot(bbox.size[0], bbox.size[1], bbox.size[2]) / 2);
    const az = (opt.az == null ? -52 : opt.az) * Math.PI/180;
    const el = U.clamp(opt.el == null ? 26 : opt.el, -85, 85) * Math.PI/180;
    const d = [Math.cos(el)*Math.cos(az), Math.cos(el)*Math.sin(az), Math.sin(el)];
    const dist = rad * 3.2;
    const eye = [ctr[0]+d[0]*dist, ctr[1]+d[1]*dist, ctr[2]+d[2]*dist];
    const view = Render._lookAt(eye, ctr, [0,0,1]);
    const ry = rad * 1.12 / (opt.zoom || 1), rx = ry * (W/H);
    const proj = Render._ortho(rx, ry, 0.01, dist + rad*3);
    const mvp = Render._mul(proj, view);

    const put = (name, data, n)=>{
      const b = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(pr, name);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, n, gl.FLOAT, false, 0, 0);
      return b;
    };
    const b1 = put('p', pos, 3), b2 = put('n', nrm, 3);
    gl.uniformMatrix4fv(gl.getUniformLocation(pr,'mvp'), false, mvp);
    gl.uniformMatrix4fv(gl.getUniformLocation(pr,'mv'), false, view);
    const col = opt.color || [1.0, 0.545, 0.24];
    gl.uniform3f(gl.getUniformLocation(pr,'base'), col[0], col[1], col[2]);
    gl.uniform2f(gl.getUniformLocation(pr,'dr'), dist - rad, dist + rad);
    gl.drawArrays(gl.TRIANGLES, 0, pos.length/3);
    gl.deleteBuffer(b1); gl.deleteBuffer(b2);
    return Render._cv;
  },
  async toBlob(pos, nrm, bbox, opt){
    Render.draw(pos, nrm, bbox, opt);
    return await new Promise(res=>Render._cv.toBlob(res, 'image/webp', 0.86));
  },
  canvas(){ return Render._cv; }
};

/* ============================================================
   Thumbs — blob store + object URL cache
   ============================================================ */
const Thumbs = {
  _urls: new Map(),
  async put(id, blob){ await DB.put('thumbs', {id, blob}); Thumbs._urls.delete(id); return id; },
  async url(id){
    if(!id) return null;
    if(Thumbs._urls.has(id)) return Thumbs._urls.get(id);
    const rec = await DB.get('thumbs', id);
    if(!rec || !rec.blob){ Thumbs._urls.set(id, null); return null; }
    const u = URL.createObjectURL(rec.blob);
    Thumbs._urls.set(id, u);
    return u;
  },
  async del(id){ if(!id) return; const u = Thumbs._urls.get(id); if(u) URL.revokeObjectURL(u);
    Thumbs._urls.delete(id); await DB.del('thumbs', id).catch(()=>{}); },
  /* Hydrate every <img data-thumb="id"> currently in the DOM */
  async hydrate(root){
    const els = (root||document).querySelectorAll('img[data-thumb]:not([data-done])');
    for(const el of els){
      el.setAttribute('data-done','1');
      const u = await Thumbs.url(el.getAttribute('data-thumb'));
      if(u) el.src = u; else el.closest('.pv-thumb,.th,.dt-img') && el.remove();
    }
  }
};

/* ============================================================
   FS — filesystem access

   Two implementations behind one interface, picked at load time. The browser
   build goes through the File System Access API; the desktop build calls into
   the Tauri shell. Callers never see a handle or a path, only a root record,
   which is what keeps the rest of the app identical on both.
   ============================================================ */

/* Engine-agnostic helpers, shared by both implementations */
const FSCommon = {
  skipSet(){
    const s = new Set(String(Store.settings.skipDirs||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean));
    // quarantined duplicates must never come back as fresh models
    s.add(String(Store.settings.quarantineDir||'_PrintVault_quarantine').toLowerCase());
    return s;
  },
  /* CRC-32, the checksum every zip entry already carries. Chainable across
     chunks so it can verify a stream without buffering it. */
  _crcT:(function(){ const t=new Uint32Array(256);
    for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[i]=c>>>0; }
    return t; })(),
  crc32(buf, prev){
    const t = FSCommon._crcT;
    let c = (prev === undefined ? 0 : prev) ^ 0xFFFFFFFF;
    for(let i=0;i<buf.length;i++) c = t[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  },
  async inflateRaw(u8){
    const st = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(st).arrayBuffer());
  },
  /* Reject anything that would write outside the destination folder */
  safeSegs(name){
    const parts = String(name).split(/[\\/]+/), out = [];
    for(const p of parts){
      if(!p || p === '.') continue;
      if(p === '..') return null;
      if(/^[a-zA-Z]:$/.test(p)) return null;
      out.push(p.replace(/[<>:"|?*\x00-\x1f]/g, '_').replace(/[. ]+$/, ''));
    }
    return out.length ? out : null;
  },
  /* Read the first and last slice of a file as text, for slicer headers and
     footers, without ever loading the middle. */
  async headTail(rootId, path, size, headBytes, tailBytes){
    const dec = new TextDecoder();
    const head = dec.decode(new Uint8Array(await FS.readRange(rootId, path, 0, Math.min(headBytes, size))));
    let tail = '';
    if(size > headBytes + 40000){
      const from = Math.max(0, size - tailBytes);
      tail = dec.decode(new Uint8Array(await FS.readRange(rootId, path, from, size)));
    }
    return {head, tail};
  }
};

/* ---------- Browser: File System Access API ---------- */
const BrowserFS = Object.assign({}, FSCommon, {
  kind: 'browser',
  supported: typeof window.showDirectoryPicker === 'function',
  secure: window.isSecureContext,
  _dirCache: new Map(),
  resetCache(){ BrowserFS._dirCache.clear(); },

  /* Returns the fields to merge into a root record, or null if cancelled */
  async pick(){
    const h = await window.showDirectoryPicker({mode:'read', id:'printvault-root', startIn:'documents'});
    return h ? {handle:h, name:h.name} : null;
  },
  async same(root, picked){
    if(!root.handle || !picked.handle) return false;
    try{ return await root.handle.isSameEntry(picked.handle); }catch(e){ return false; }
  },
  /* Confirm access, prompting if the browser has forgotten the grant */
  async ensure(root, mode){
    if(!root || !root.handle) return false;
    const o = {mode: mode || 'read'};
    try{
      if(await root.handle.queryPermission(o) === 'granted') return true;
      return (await root.handle.requestPermission(o)) === 'granted';
    }catch(e){ return false; }
  },
  /* Non-prompting check, for the reconnect hint on startup */
  async granted(root){
    if(!root || !root.handle) return false;
    try{ return await root.handle.queryPermission({mode:'read'}) === 'granted'; }
    catch(e){ return false; }
  },

  async *walk(root, skip, stats){
    yield* BrowserFS._walk(root.handle, '', skip, 0, stats);
  },
  async *_walk(handle, base, skip, depth, stats){
    depth = depth || 0;
    if(depth > 24){ if(stats) stats.tooDeep++; return; }
    // Buffer the listing so a failure part-way through enumeration is caught
    // rather than silently truncating the whole subtree. Network shares can
    // drop out mid-listing, and that used to vanish without a word.
    const items = [];
    try{
      for await (const ent of handle.entries()) items.push(ent);
    }catch(e){
      if(stats) stats.badDirs.push({path: base || '(top level)', error: String((e && e.message) || e)});
      return;
    }
    for(const [name, h] of items){
      if(name.startsWith('.') && name !== '.') continue;
      if(h.kind === 'directory'){
        if(skip.has(name.toLowerCase())) continue;
        yield* BrowserFS._walk(h, base ? base + '/' + name : name, skip, depth + 1, stats);
      } else {
        yield {name, path: base ? base + '/' + name : name};
      }
    }
  },

  async resolveDir(rootHandle, dirPath){
    if(!dirPath) return rootHandle;
    const key = (rootHandle.name||'') + ' ' + dirPath;
    if(BrowserFS._dirCache.has(key)) return BrowserFS._dirCache.get(key);
    let h = rootHandle;
    for(const seg of dirPath.split('/')){
      if(!seg) continue;
      h = await h.getDirectoryHandle(seg);
    }
    BrowserFS._dirCache.set(key, h);
    return h;
  },
  async fileHandle(rootId, path){
    const r = Store.root(rootId);
    if(!r || !r.handle) throw new Error('Folder not connected');
    const dir = await BrowserFS.resolveDir(r.handle, U.dir(path));
    return await dir.getFileHandle(U.base(path));
  },
  async read(rootId, path){
    return await (await BrowserFS.fileHandle(rootId, path)).getFile();
  },
  async readRange(rootId, path, start, end){
    const file = await BrowserFS.read(rootId, path);
    return await file.slice(start, Math.min(end, file.size)).arrayBuffer();
  },
  async readTail(rootId, path, bytes){
    const file = await BrowserFS.read(rootId, path);
    const start = Math.max(0, file.size - bytes);
    return {buf: await file.slice(start).arrayBuffer(), base: start, size: file.size};
  },
  async size(rootId, path){
    return (await BrowserFS.read(rootId, path)).size;
  },

  async mkdirp(rootHandle, segs){
    let dir = rootHandle;
    for(const s of segs) dir = await dir.getDirectoryHandle(s, {create:true});
    return dir;
  },

  async moveToQuarantine(rootId, path, quarantineDir){
    const r = Store.root(rootId);
    if(!r || !r.handle) throw new Error('Folder is not connected');
    if(!(await BrowserFS.ensure(r, 'readwrite'))) throw new Error('Write permission denied');
    const srcDir = await BrowserFS.resolveDir(r.handle, U.dir(path));
    const srcName = U.base(path);
    const fh = await srcDir.getFileHandle(srcName);

    const segs = [quarantineDir].concat(path.split('/').filter(Boolean));
    let dir = r.handle;
    for(let i=0;i<segs.length-1;i++) dir = await dir.getDirectoryHandle(segs[i], {create:true});
    const leaf = segs[segs.length-1];

    // Chromium can move a file handle directly; fall back to copy then remove
    if(typeof fh.move === 'function'){
      try{ await fh.move(dir, leaf); return; }catch(e){ /* fall through */ }
    }
    const file = await fh.getFile();
    const dest = await dir.getFileHandle(leaf, {create:true});
    const w = await dest.createWritable();
    await file.stream().pipeTo(w);
    const check = await (await dir.getFileHandle(leaf)).getFile();
    if(check.size !== file.size){
      try{ await dir.removeEntry(leaf); }catch(_){}
      throw new Error('Copy verification failed, original left alone');
    }
    await srcDir.removeEntry(srcName);
  },

  async deleteFile(rootId, path){
    const r = Store.root(rootId);
    if(!r || !r.handle) throw new Error('Folder not connected');
    if(!(await BrowserFS.ensure(r, 'readwrite'))) throw new Error('Write permission denied');
    const dir = await BrowserFS.resolveDir(r.handle, U.dir(path));
    await dir.removeEntry(U.base(path));
  },

  canOpenExternally: false,
  extractNatively: null   // the browser build unpacks archives in JS
});

/* ---------- Desktop: Tauri shell ---------- */
const DesktopFS = Object.assign({}, FSCommon, {
  kind: 'desktop',
  supported: true,
  secure: true,
  resetCache(){},
  _call(cmd, args){ return window.__TAURI__.core.invoke(cmd, args || {}); },
  _root(rootId){
    const r = Store.root(rootId);
    if(!r || !r.path) throw new Error('Folder is not connected');
    return r.path;
  },

  async pick(){
    const p = await DesktopFS._call('pv_pick_folder');
    if(!p) return null;
    const name = p.replace(/[\\/]+$/,'').split(/[\\/]/).pop() || p;
    return {path:p, name};
  },
  async same(root, picked){ return !!root.path && root.path === picked.path; },
  /* A path either exists or it does not. There is no permission to re-grant,
     which is the main thing the desktop build buys. */
  async ensure(root){
    if(!root || !root.path) return false;
    return await DesktopFS._call('pv_root_ok', {root: root.path});
  },
  async granted(root){ return await DesktopFS.ensure(root); },

  /* One call returns the whole tree, rather than a round trip per file */
  async *walk(root, skip, stats){
    const res = await DesktopFS._call('pv_walk', {
      root: root.path, skip: Array.from(skip), max: 2000000
    });
    if(stats && res.skipped_dirs && res.skipped_dirs.length)
      res.skipped_dirs.forEach(d=>stats.badDirs.push({path:d, error:'unreadable'}));
    if(stats && res.truncated) stats.tooDeep++;
    for(const f of res.files) yield {name:f.name, path:f.path, size:f.size, mtime:f.mtime};
  },

  async read(rootId, path){
    const buf = await DesktopFS._call('pv_read', {root: DesktopFS._root(rootId), rel: path});
    return new File([buf], U.base(path));
  },
  async readRange(rootId, path, start, end){
    const buf = await DesktopFS._call('pv_read_range', {
      root: DesktopFS._root(rootId), rel: path, start: Math.max(0, start), len: Math.max(0, end - start)
    });
    return buf instanceof ArrayBuffer ? buf : new Uint8Array(buf).buffer;
  },
  async stat(rootId, path){
    return await DesktopFS._call('pv_stat', {root: DesktopFS._root(rootId), rel: path});
  },
  async size(rootId, path){
    const s = await DesktopFS.stat(rootId, path);
    return s ? s.size : 0;
  },
  async readTail(rootId, path, bytes){
    const size = await DesktopFS.size(rootId, path);
    const start = Math.max(0, size - bytes);
    return {buf: await DesktopFS.readRange(rootId, path, start, size), base: start, size};
  },

  async moveToQuarantine(rootId, path, quarantineDir){
    const to = quarantineDir + '/' + path;
    await DesktopFS._call('pv_move', {root: DesktopFS._root(rootId), from: path, to});
  },
  async deleteFile(rootId, path){
    await DesktopFS._call('pv_remove', {root: DesktopFS._root(rootId), rel: path});
  },

  /* Unpacking happens in Rust so archive bytes never cross the bridge */
  async extractNatively(rootId, archiveRel, destRel){
    return await DesktopFS._call('pv_extract', {
      root: DesktopFS._root(rootId), archiveRel, destRel
    });
  },

  canOpenExternally: true,
  async openExternal(rootId, path, reveal){
    await DesktopFS._call('pv_open', {root: DesktopFS._root(rootId), rel: path, reveal: !!reveal});
  }
});

/* The shell sets __PV_DESKTOP__ before any app JS runs */
const FS = (typeof window.__PV_DESKTOP__ === 'string' && window.__TAURI__) ? DesktopFS : BrowserFS;


/* ============================================================
   Img — downscale an image blob to a 4:3 thumbnail
   ============================================================ */
async function imgThumb(blob, size){
  const W = size || 320, H = Math.round(W*0.75);
  let bmp;
  try{ bmp = await createImageBitmap(blob); }catch(e){ return null; }
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#151920'; cx.fillRect(0,0,W,H);
  const s = Math.max(W/bmp.width, H/bmp.height);
  const dw = bmp.width*s, dh = bmp.height*s;
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(bmp, (W-dw)/2, (H-dh)/2, dw, dh);
  bmp.close && bmp.close();
  return await new Promise(r=>cv.toBlob(r, 'image/webp', 0.84));
}

/* Prefer-this-image scoring for cover art inside a model folder */
function imageScore(name){
  const n = name.toLowerCase();
  let s = 0;
  if(/(^|[_\-\s])(cover|preview|thumb|thumbnail|hero|title|main|render|display)/.test(n)) s += 100;
  if(/(^|[_\-\s])(0?1|01)([_\-\s.]|$)/.test(n)) s += 20;
  if(/(assembly|instruction|step|diagram|license|logo|qr)/.test(n)) s -= 60;
  return s;
}

/* ============================================================
   Meta — the stuff you typed, kept apart from the stuff on disk

   Tags, collections, notes and ratings belong to a model, but a model's id
   is built from a root id that's generated fresh every time a folder is
   added. Tying metadata to that id means a backup only restores into the
   library it came from. So an import parks its metadata by folder name and
   relative path instead, and both importing and scanning try to claim it.
   Restore first or scan first, either order works.
   ============================================================ */
const Meta = {
  FIELDS: ['tags','collections','source','creator','license','notes','rating','favorite'],
  norm(s){ return String(s==null?'':s).replace(/\\/g,'/').replace(/^\/+|\/+$/g,'').trim().toLowerCase(); },
  key(rootName, path){ return Meta.norm(rootName)+'|'+Meta.norm(path); },

  /* worth keeping? blank metadata isn't worth parking or applying */
  any(m){
    return !!((m.tags||[]).length || (m.collections||[]).length || m.notes ||
              m.rating || m.favorite || m.source || m.creator || m.license);
  },

  /* Only fills blanks. If you've tagged something since the backup, importing
     an older one shouldn't quietly undo that. */
  apply(model, meta){
    let hit = false;
    for(const f of Meta.FIELDS){
      const v = meta[f];
      if(v == null || v === '' || v === false || v === 0) continue;
      if(Array.isArray(v)){
        const cur = model[f] || [];
        const add = v.filter(x=>!cur.includes(x));
        if(!add.length) continue;
        model[f] = cur.concat(add);
      } else {
        if(model[f]) continue;
        model[f] = v;
      }
      hit = true;
    }
    return hit;
  },

  async park(entries){
    const recs = [];
    for(const e of entries){
      if(!Meta.any(e)) continue;
      const rec = {id: Meta.key(e.rootName, e.path), rootName:e.rootName||'', path:e.path||'',
                   name:e.name||'', base:U.base(e.path||''), parkedAt:Date.now()};
      Meta.FIELDS.forEach(f=>{ if(e[f] != null) rec[f] = e[f]; });
      recs.push(rec);
    }
    if(!recs.length) return 0;
    await DB.putMany('parked', recs);
    const byId = new Map(Store.parked.map(p=>[p.id,p]));
    recs.forEach(r=>byId.set(r.id, r));
    Store.parked = Array.from(byId.values());
    return recs.length;
  },

  /* Hand parked metadata to whichever models can take it. Tries the folder
     name and path first, then the path alone in case the folder was renamed,
     then the model's own folder or file name. Anything ambiguous is left
     parked rather than guessed at. */
  async adopt(models){
    if(!Store.parked.length || !models || !models.length) return 0;
    const byKey = new Map(), byPath = new Map(), byBase = new Map();
    const add = (map, k, m)=>{ if(!k || k === '|') return;
      map.set(k, map.has(k) ? null : m); };   // null marks "more than one, can't tell"
    for(const m of models){
      const rn = (Store.root(m.rootId)||{}).name || '';
      add(byKey, Meta.key(rn, m.path), m);
      add(byPath, Meta.norm(m.path), m);
      add(byBase, Meta.norm(U.base(m.path)), m);
    }
    const taken = new Set(), claimed = [], touched = new Map();
    for(const p of Store.parked){
      const m = byKey.get(p.id) || byPath.get(Meta.norm(p.path)) || byBase.get(Meta.norm(p.base));
      if(!m || taken.has(m.id)) continue;
      taken.add(m.id); claimed.push(p.id);
      if(Meta.apply(m, p)) touched.set(m.id, m);
    }
    if(!claimed.length) return 0;
    for(const m of touched.values()) await Store.put('models', m);
    await DB.delMany('parked', claimed);
    const gone = new Set(claimed);
    Store.parked = Store.parked.filter(p=>!gone.has(p.id));
    return claimed.length;
  },

  async clear(){
    await DB.clear('parked');
    Store.parked = [];
  }
};

/* ============================================================
   Scan — index folders into models + files
   ============================================================ */
const Scan = {
  busy:false,

  async addRoot(){
    if(!FS.supported) return Scan.unsupported();
    let picked;
    try{ picked = await FS.pick(); }
    catch(e){
      // Cancelling the picker is not an error, anything else is and used to be swallowed
      if(e && (e.name === 'AbortError' || /abort|cancel/i.test(String(e.message||'')))) return;
      return Scan.pickFailed(e);
    }
    if(!picked) return;
    for(const r of Store.roots){
      if(await FS.same(r, picked)) return Toast.err('That folder is already in your library');
    }
    // A drive or share root comes back named "\" or blank, which is useless in a list
    const label = String(picked.name||'').replace(/[\\/:]+/g,'').trim() || 'Network folder';
    const root = Object.assign({id:U.id('r'), addedAt:Date.now(), lastScan:0,
      files:0, models:0, bytes:0}, picked, {name:label});
    await Store.put('roots', root);
    Toast.ok('Added "' + label + '"');
    UI.render();
    await Scan.run([root.id]);
  },

  pickFailed(e){
    const msg = String((e && e.message) || e || 'Unknown error');
    Modal.open('Could not open that folder',
      '<div class="note bad"><b>The browser refused access.</b><br>'+
      '<span class="mono" style="font-size:12px">'+U.esc(msg)+'</span></div>'+
      '<p style="color:var(--dim);line-height:1.65;margin:0 0 10px">Things worth trying, roughly in order:</p>'+
      '<ul style="line-height:1.85;color:var(--dim);padding-left:20px;margin:0 0 14px">'+
        '<li><b>Pick a folder inside it</b> rather than a drive letter on its own. '+
          'Browsers refuse some locations outright regardless of permission.</li>'+
        '<li><b>Avoid system and program folders</b>, and the top of your user profile.</li>'+
        '<li><b>On a network share</b>, make sure it is connected in Explorer first. '+
          'A browser cannot reconnect a dropped mapping. Reaching it through the network path '+
          '(<code>\\\\server\\share\\folder</code>) sometimes works when the drive letter does not.</li>'+
      '</ul>'+
      '<div class="note">The desktop build has none of these restrictions, if this keeps getting in the way.</div>',
      '<button class="b" onclick="PV.Modal.close()">Close</button>'+
      '<button class="b p" onclick="PV.Modal.close();PV.Scan.addRoot()">Try another folder</button>');
  },

  unsupported(){
    Modal.open('Folder access not available',
      '<div class="note bad"><b>This browser cannot index folders.</b><br>PrintVault uses the File System Access API, which needs:</div>'+
      '<ul style="line-height:1.9;color:var(--dim);padding-left:20px;margin:0 0 12px">'+
      '<li>Chrome, Edge, Opera, or Brave on desktop (not Firefox or Safari)</li>'+
      '<li>A <b>secure context</b>: served over <code>https://</code> or <code>http://localhost</code></li>'+
      '</ul>'+
      (!FS.secure ? '<div class="note bad">You are on <code>'+U.esc(location.protocol)+'</code>, which is not a secure context. Serve this file from a local web server, for example:<br><br><code style="display:block;background:var(--bg);padding:8px 10px;border-radius:6px;margin-top:6px">py -m http.server 8080</code><br>then open <code>http://localhost:8080/printvault/</code></div>' : '')+
      '<p style="color:var(--dim);font-size:12.5px;line-height:1.6;margin:0">Everything else in PrintVault still works. You can add models, prints, filament, and queue entries by hand.</p>',
      '<button class="b p" onclick="PV.Modal.close()">Got it</button>');
  },

  /* Decide which directory represents "the model" for a given file path.
     `cat` is the set of category folders (see Scan.classify). A file sitting
     loose inside a category folder is its own model, not part of a lump. */
  modelPathFor(filePath, ctx){
    const dir = U.dir(filePath);
    if(!dir) return {path:filePath, loose:true};
    const cat = ctx && ctx.cat, merge = ctx && ctx.merge;
    if(cat && cat.has(dir)) return {path:filePath, loose:true};
    const segs = dir.split('/');
    let i = segs.length - 1;
    while(i > 0){
      const cur = segs.slice(0, i+1).join('/');
      // climb out of wrapper folders, and out of a folder that is just the
      // unpacked form of an archive sitting beside it (skeletor/ next to skeletor.zip)
      if(GENERIC_DIRS.has(segs[i].toLowerCase()) || (merge && merge.has(cur))) i--;
      else break;
    }
    return {path: segs.slice(0, i+1).join('/'), loose:false};
  },

  /* Work out the folder layout before grouping.
     A "category" folder is one holding at least one real (non-generic)
     subfolder that contains printable files, e.g. Figurines/ holding
     Figurines/Deadpool/ and Figurines/Skeletor/. Loose files sitting beside
     those subfolders are separate models rather than parts of one. */
  classify(found){
    const dirs = new Set(), printable = new Set();
    found.forEach(f=>{
      let d = U.dir(f.path);
      if(isPrintable(f.ext)){ let x = d; for(;;){ printable.add(x); if(!x) break; x = U.dir(x); } }
      while(d){ dirs.add(d); d = U.dir(d); }
    });

    // real (non-wrapper) subfolders holding printable files, grouped by parent
    const subs = new Map();
    dirs.forEach(d=>{
      if(GENERIC_DIRS.has(U.base(d).toLowerCase())) return;
      if(!printable.has(d)) return;
      const p = U.dir(d);
      if(!subs.has(p)) subs.set(p, []);
      subs.get(p).push(d);
    });

    // stems of models/archives sitting loose directly in each folder
    const stems = new Map();
    found.forEach(f=>{
      if(!isPrintable(f.ext) && f.kind !== 'arch') return;
      const d = U.dir(f.path);
      if(!stems.has(d)) stems.set(d, new Set());
      stems.get(d).add(U.stem(f.name).toLowerCase());
    });

    const cat = new Set(), merge = new Set();
    subs.forEach((list, parent)=>{
      const near = stems.get(parent);
      // a subfolder named like a file beside it is that file unpacked, so it
      // belongs to the same model rather than being a separate one
      const twins = list.filter(d=>near && near.has(U.base(d).toLowerCase()));
      twins.forEach(d=>merge.add(d));
      const rest = list.length - twins.length;
      // two or more unrelated model subfolders means this is a category folder,
      // so anything loose beside them is its own model
      if(rest >= 2 || (rest === 1 && !twins.length)) cat.add(parent);
    });
    return {dirs, cat, merge};
  },

  async run(rootIds){
    if(Scan.busy) return Toast.err('A scan is already running');
    const roots = (rootIds && rootIds.length ? rootIds.map(id=>Store.root(id)) : Store.roots).filter(Boolean);
    if(!roots.length) return Toast.err('No folders to scan. Add one first.');
    Scan.busy = true;
    Prog.start('Preparing scan...');
    let added = 0, removed = 0, updated = 0;
    try{
      for(const root of roots){
        if(Prog.cancelled) break;
        if(!(await FS.ensure(root, 'read'))){
          Toast.err(FS.kind === 'desktop'
            ? '"'+root.name+'" is not reachable. If it is a network share, check it is connected.'
            : 'Permission denied for "'+root.name+'"');
          continue;
        }
        FS.resetCache();
        await Scan._one(root, s=>{ added+=s.added; removed+=s.removed; updated+=s.updated; });
      }
    }catch(e){
      console.error(e); Toast.err('Scan failed: ' + e.message);
    }finally{
      Scan.busy = false; Prog.stop();
      await Store.setting('lastScan', Date.now());
      Store.reindex(); UI.render();
    }
    Toast.ok('Scan done: '+added+' new, '+updated+' updated, '+removed+' removed');
  },

  async _one(root, report){
    const skip = FS.skipSet();

    /* --- 1. walk --- */
    Prog.set('Walking '+root.name+'...', 0, 1);
    const found = [];
    const stats = {badDirs:[], tooDeep:0, total:0};
    let seen = 0;
    for await (const f of FS.walk(root, skip, stats)){
      if(Prog.cancelled) return;
      stats.total++;
      const ext = U.ext(f.name), kind = kindOf(ext);
      if(kind === 'other') continue;
      // size/mtime arrive with the listing on desktop; the browser must stat separately
      found.push({name:f.name, path:f.path, ext, kind, size:f.size, mtime:f.mtime});
      if(++seen % 200 === 0) Prog.set('Walking '+root.name+': '+seen+' files', seen % 2000, 2000);
    }
    if(Prog.cancelled) return;

    if(stats.badDirs.length){
      console.warn('[PrintVault] unreadable folders in "'+root.name+'":', stats.badDirs);
      Toast.err(stats.badDirs.length+' folder'+(stats.badDirs.length===1?'':'s')+' in "'+root.name+
        '" could not be listed and were skipped, starting with "'+stats.badDirs[0].path+'" ('+
        stats.badDirs[0].error+'). Network drives can drop out mid-scan. See the console for the full list.');
    }
    if(!found.length){
      Toast.err('No usable files found in "'+root.name+'". '+
        (stats.total ? 'It holds '+stats.total+' files but none are model, gcode, image or archive types.'
                     : 'The folder read as empty, which on a network drive usually means it is no longer reachable.'));
    }

    /* --- 2. stat --- */
    const layout = Scan.classify(found);
    const oldFiles = new Map(Store.files.filter(f=>f.rootId===root.id).map(f=>[f.path, f]));
    const recs = [], changed = [];
    let unreadable = 0;
    for(let i=0;i<found.length;i++){
      if(Prog.cancelled) return;
      const f = found[i];
      if(i % 40 === 0) Prog.set('Reading file info ('+(i+1)+'/'+found.length+')', i, found.length);
      // The desktop walk already carries size and mtime, so this whole pass is
      // free there. The browser has to open every file just to learn its size.
      let size = f.size, mtime = f.mtime;
      if(size === undefined){
        try{ const file = await FS.read(root.id, f.path); size = file.size; mtime = file.lastModified; }
        catch(e){ unreadable++; continue; }
      }
      const prev = oldFiles.get(f.path);
      let mp = Scan.modelPathFor(f.path, layout);
      if(f.kind === 'arch'){
        const stem = U.stem(f.path);
        // Already unpacked? Then the archive belongs to the model it produced,
        // rather than standing as a second card for the same thing.
        // Never unpacked? Then it is a model in its own right, otherwise the
        // whole download stays invisible in the library.
        mp = layout.dirs.has(stem)
          ? Scan.modelPathFor(stem + '/_', layout)
          : {path:f.path, loose:true};
      }
      const rec = {
        id: root.id+':'+f.path, rootId: root.id, path: f.path, name: f.name,
        ext: f.ext, kind: f.kind, size: size, mtime: mtime,
        modelId: root.id+'::'+mp.path
      };
      if(prev){
        rec.sha = prev.sha; rec.g = prev.g; rec.thumbId = prev.thumbId; rec.zip = prev.zip;
        rec.metaV = prev.metaV; rec.zipV = prev.zipV; rec.projV = prev.projV;
        if(prev.size !== rec.size || prev.mtime !== rec.mtime){
          delete rec.sha; delete rec.g; delete rec.zip;
          delete rec.metaV; delete rec.zipV; delete rec.projV;
          changed.push(rec);
        }
      } else changed.push(rec);
      recs.push(rec);
      oldFiles.delete(f.path);
    }
    const removedIds = Array.from(oldFiles.values()).map(f=>f.id);

    /* --- 3. persist the file list up front ---
       Written before the slow metadata passes so that closing the tab mid-scan
       keeps everything done so far. Combined with the META_V stamps, the next
       scan picks up exactly where this one stopped. */
    await DB.putMany('files', recs.map(r=>Object.assign({}, r)),
      (done,total)=>{ if(total > 5000) Prog.set('Saving index ('+done.toLocaleString()+'/'+total.toLocaleString()+')', done, total); });
    if(removedIds.length) await DB.delMany('files', removedIds);
    Store.files = Store.files.filter(f=>f.rootId !== root.id).concat(recs);

    const flush = async list=>{ if(list.length) await DB.putMany('files', list.splice(0).map(r=>Object.assign({}, r))); };

    /* --- 4. metadata for gcode ---
       re-read anything not stamped with the current extractor version, so an
       app update also picks up files that were indexed by an older build */
    const meta = recs.filter(r=>r.kind === 'gcode' && r.ext !== 'bgcode' && r.ext !== 'ufp' && r.metaV !== META_V);
    const dirtyMeta = [];
    for(let i=0;i<meta.length;i++){
      if(Prog.cancelled) break;
      Prog.set('Reading slicer data ('+(i+1)+'/'+meta.length+')', i, meta.length);
      const r = meta[i];
      try{
        const ht = await FS.headTail(root.id, r.path, r.size, 220000, 120000);
        const out = await Work.call({op:'gcode', head: ht.head, tail: ht.tail});
        if(out.g && Object.keys(out.g).length){
          if(out.g.thumbB64){
            try{
              const bin = atob(out.g.thumbB64);
              const u8 = new Uint8Array(bin.length);
              for(let k=0;k<bin.length;k++) u8[k] = bin.charCodeAt(k);
              const tb = await imgThumb(new Blob([u8], {type:'image/png'}), Store.settings.thumbSize);
              if(tb){ r.thumbId = 't'+r.id; await Thumbs.put(r.thumbId, tb); }
            }catch(e){}
            delete out.g.thumbB64;
          }
          r.g = out.g;
        }
        r.metaV = META_V;
      }catch(e){ r.metaV = META_V; /* unreadable gcode, do not retry every scan */ }
      dirtyMeta.push(r);
      if(dirtyMeta.length >= 25) await flush(dirtyMeta);
    }
    await flush(dirtyMeta);

    /* --- 4a. slicer data inside project 3MFs ---
       Creality Print, OrcaSlicer and Bambu Studio save the sliced gcode inside
       the .3mf rather than beside it, so the print settings are invisible
       unless we look in there. */
    const projects = recs.filter(r=>r.ext === '3mf' && r.projV !== META_V);
    for(let i=0;i<projects.length;i++){
      if(Prog.cancelled) break;
      Prog.set('Reading project files ('+(i+1)+'/'+projects.length+')', i, projects.length);
      const r = projects[i];
      try{
        const entries = await Archive.entries(r);
        const gc = entries.filter(e=>/plate_\d*\.gcode$/i.test(e.name))
                          .sort((a,b)=>b.size - a.size)[0];
        if(gc && gc.size < 90e6){
          const bytes = await Archive.extractEntry(r, gc);
          const dec = new TextDecoder();
          const head = dec.decode(bytes.subarray(0, Math.min(220000, bytes.length)));
          const tail = bytes.length > 260000 ? dec.decode(bytes.subarray(bytes.length - 120000)) : '';
          const out = await Work.call({op:'gcode', head, tail});
          if(out.g && Object.keys(out.g).length){
            delete out.g.thumbB64;   // the project already carries a plate render
            r.g = out.g;
          }
        }
      }catch(e){ /* not a sliced project, or unreadable */ }
      r.projV = META_V;
      dirtyMeta.push(r);
      if(dirtyMeta.length >= 15) await flush(dirtyMeta);
    }
    await flush(dirtyMeta);

    /* --- 4b. index inside unextracted zips (tail read only, ~256 KB each) --- */
    const zips = recs.filter(r=>r.kind === 'arch' && r.ext === 'zip' && r.zipV !== META_V &&
                                !layout.dirs.has(U.stem(r.path)));
    const dirtyZip = [];
    for(let i=0;i<zips.length;i++){
      if(Prog.cancelled) break;
      Prog.set('Reading archive contents ('+(i+1)+'/'+zips.length+')', i, zips.length);
      const r = zips[i];
      try{
        const entries = await Archive.entries(r);
        const meshes = entries.filter(x=>['stl','3mf','obj'].includes(U.ext(x.name)));
        r.zip = {n: entries.length, meshes: meshes.length, entries: entries.slice(0, 400)};
      }catch(e){ r.zip = {n:0, meshes:0, entries:[], error:String(e.message).slice(0,120)}; }
      r.zipV = META_V;
      dirtyZip.push(r);
      if(dirtyZip.length >= 15) await flush(dirtyZip);
    }
    await flush(dirtyZip);

    /* --- 5. build models --- */
    const byModel = new Map();
    recs.forEach(r=>{
      if(!byModel.has(r.modelId)) byModel.set(r.modelId, []);
      byModel.get(r.modelId).push(r);
    });
    const oldModels = new Map(Store.models.filter(m=>m.rootId===root.id).map(m=>[m.id, m]));
    const models = [];
    for(const [mid, list] of byModel){
      const hasPrintable = list.some(f=>isPrintable(f.ext));
      const archOnly = list.length === 1 && list[0].kind === 'arch';
      if(!hasPrintable && !archOnly) continue;
      const prev = oldModels.get(mid);
      const mpath = mid.split('::')[1];
      // the model path IS a file path when the model is a single loose file
      const loose = list.length === 1 && list[0].path === mpath;
      const nameSrc = loose ? U.stem(U.base(mpath)) : (U.base(mpath) || root.name);
      const gc = list.filter(f=>f.g).map(f=>f.g);
      const best = gc.sort((a,b)=>(b.timeMin||0)-(a.timeMin||0))[0] || null;
      const m = Object.assign({
        id: mid, rootId: root.id, path: mpath,
        name: U.titleize(nameSrc),
        tags: [], collections: [], source:'', creator:'', license:'', notes:'',
        rating: 0, favorite: false, thumbId: null, thumbSrc: null,
        createdAt: Date.now()
      }, prev || {});
      m.isArchive = archOnly && !hasPrintable;
      m.archiveExt = m.isArchive ? list[0].ext : null;
      if(m.isArchive && list[0].zip){
        // inner filenames make the archive searchable without unpacking it
        m.innerCount = list[0].zip.meshes;
        m.inner = list[0].zip.entries
          .filter(x=>['stl','3mf','obj'].includes(U.ext(x.name)))
          .slice(0, 60).map(x=>U.stem(U.base(x.name)));
      } else { m.innerCount = 0; m.inner = null; }
      m.fileCount = list.length;
      m.bytes = list.reduce((s,f)=>s+(f.size||0), 0);
      m.meshCount = list.filter(f=>f.kind==='mesh').length;
      m.gcodeCount = list.filter(f=>f.kind==='gcode').length;
      m.imgCount = list.filter(f=>f.kind==='image').length;
      m.mtime = list.reduce((s,f)=>Math.max(s, f.mtime||0), 0);
      m.est = best ? {timeMin:best.timeMin||null, grams:best.grams||null, material:best.material||null,
                      layerH:best.layerH||null, nozzle:best.nozzle||null, printer:best.printer||null} : null;
      m.updatedAt = Date.now();
      models.push(m);
      oldModels.delete(mid);
    }
    const goneModels = Array.from(oldModels.keys());
    await DB.putMany('models', models);
    if(goneModels.length) await DB.delMany('models', goneModels);
    Store.models = Store.models.filter(m=>m.rootId !== root.id).concat(models);
    Store.reindex();

    // metadata from a backup restored before this folder existed
    const adopted = await Meta.adopt(models);
    if(adopted) Toast.ok('Restored tags and notes for '+adopted+' model'+(adopted===1?'':'s')+' from your backup');

    /* --- 6. source URLs from readme-ish files --- */
    const needSrc = models.filter(m=>!m.source);
    for(let i=0;i<needSrc.length && i<600;i++){
      if(Prog.cancelled) break;
      const m = needSrc[i];
      const cands = Store.modelFiles(m.id).filter(f=>
        (f.kind==='doc' && f.size < 200000 && /readme|source|about|info|credit|licen[cs]e|description/i.test(f.name)) ||
        /\.(url|webloc|desktop)$/i.test(f.name));
      if(!cands.length) continue;
      if(i % 10 === 0) Prog.set('Looking for source links ('+(i+1)+'/'+needSrc.length+')', i, needSrc.length);
      for(const c of cands){
        try{
          const txt = await (await FS.read(root.id, c.path)).slice(0, 200000).text();
          const url = (txt.match(/https?:\/\/(?:www\.)?(?:thingiverse|printables|makerworld|cults3d|thangs|myminifactory|patreon|gumroad|github|prusaprinters)\.com\/[^\s"'<>)\]]+/i)
                    || txt.match(/https?:\/\/[^\s"'<>)\]]{12,}/))||[];
          if(url[0]){ m.source = url[0].replace(/[.,;]+$/,''); await Store.put('models', m); break; }
        }catch(e){}
      }
    }

    /* --- 7. thumbnails --- */
    if(Store.settings.thumbOnScan) await Scan.thumbnails(models);

    /* --- 8. root stats --- */
    root.lastScan = Date.now();
    root.files = recs.length; root.models = models.length;
    root.bytes = recs.reduce((s,f)=>s+(f.size||0), 0);
    await Store.put('roots', root);

    if(unreadable) Toast.err(unreadable+' file'+(unreadable===1?'':'s')+' in "'+root.name+
      '" could not be read and were skipped. Cloud-only files (OneDrive, Dropbox) must be downloaded locally first.');

    report({added: changed.length, removed: removedIds.length, updated: 0});
  },

  /* Generate thumbnails for models that lack one */
  async thumbnails(models, force){
    const todo = models.filter(m=>force || !m.thumbId);
    if(!todo.length) return;
    const size = Store.settings.thumbSize || 320;
    // Saved in batches rather than all at the end, so closing the tab partway
    // through keeps the previews already rendered instead of orphaning them.
    const dirty = [];
    for(let i=0;i<todo.length;i++){
      if(Prog.cancelled) break;
      const m = todo[i];
      Prog.set('Generating previews ('+(i+1)+'/'+todo.length+')', i, todo.length);
      try{ await Scan.thumbOne(m, size); }catch(e){ /* keep going */ }
      dirty.push(m);
      if(dirty.length >= 10){ await DB.putMany('models', dirty.splice(0)); }
      if(i % 12 === 0) await new Promise(r=>setTimeout(r, 0));
    }
    if(dirty.length) await DB.putMany('models', dirty);
    Store.reindex();
  },

  async thumbOne(m, size){
    size = size || Store.settings.thumbSize || 320;
    const files = Store.modelFiles(m.id);

    // a) gcode/3mf embedded preview already extracted during scan
    const emb = files.find(f=>f.thumbId);
    if(emb){ m.thumbId = emb.thumbId; m.thumbSrc = 'embedded'; return m; }

    // b) a cover image sitting in the folder
    const imgs = files.filter(f=>f.kind === 'image' && f.size > 2000 && f.size < 30e6)
                      .sort((a,b)=>imageScore(b.name)-imageScore(a.name) || b.size-a.size);
    if(imgs.length){
      try{
        const blob = await FS.read(m.rootId, imgs[0].path);
        const t = await imgThumb(blob, size);
        if(t){ const id = 'tm'+m.id; await Thumbs.put(id, t); m.thumbId = id; m.thumbSrc = 'image'; return m; }
      }catch(e){}
    }

    // b2) an unextracted archive: render the biggest mesh from inside it
    if(m.isArchive && m.archiveExt === 'zip'){
      const af = files[0];
      const ents = (af && af.zip && af.zip.entries || [])
        .filter(x=>['stl','3mf','obj'].includes(U.ext(x.name)) && x.size < 260e6)
        .sort((a,b)=>b.size - a.size);
      for(const ent of ents.slice(0, 2)){
        try{
          const bytes = await Archive.extractEntry(af, ent);
          const buf = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
          const out = await Work.call({op:'mesh', buf, ext:U.ext(ent.name), maxTri:260000}, [buf]);
          // a 3MF inside the archive may carry the slicer's own render, which
          // beats anything we can draw and costs nothing to reuse
          if(out.thumbBytes){
            const t = await imgThumb(new Blob([out.thumbBytes]), size);
            if(t){ const id='tm'+m.id; await Thumbs.put(id, t);
              m.thumbId=id; m.thumbSrc='archive'; return m; }
          }
          if(out.pos && out.pos.length >= 9 && out.bbox){
            const blob = await Render.toBlob(out.pos, out.nrm, out.bbox, {size});
            if(blob){ const id='tm'+m.id; await Thumbs.put(id, blob);
              m.thumbId=id; m.thumbSrc='archive'; m.bbox=out.bbox; m.tris=out.tris; return m; }
          }
        }catch(e){ /* try the next candidate */ }
      }
      m.thumbSrc = 'none';
      return m;
    }

    // c) render the mesh
    const mesh = files.filter(f=>['stl','3mf','obj'].includes(f.ext))
                      .sort((a,b)=>b.size - a.size)[0];
    if(mesh && mesh.size < 400e6){
      try{
        const file = await FS.read(m.rootId, mesh.path);
        const buf = await file.arrayBuffer();
        const out = await Work.call({op:'mesh', buf, ext:mesh.ext, maxTri:260000}, [buf]);
        if(out.thumbBytes){
          const t = await imgThumb(new Blob([out.thumbBytes]), size);
          if(t){ const id='tm'+m.id; await Thumbs.put(id, t); m.thumbId=id; m.thumbSrc='embedded'; return m; }
        }
        if(out.pos && out.pos.length >= 9 && out.bbox){
          const blob = await Render.toBlob(out.pos, out.nrm, out.bbox, {size});
          if(blob){ const id='tm'+m.id; await Thumbs.put(id, blob); m.thumbId=id; m.thumbSrc='render'; m.bbox=out.bbox; m.tris=out.tris; return m; }
        }
      }catch(e){ /* unparseable mesh */ }
    }
    m.thumbSrc = 'none';
    return m;
  },

  /* Hash files that share a size with at least one other file (dedupe prefilter) */
  async hashAll(all){
    const bySize = new Map();
    Store.files.forEach(f=>{
      if(f.size < 1024) return;
      if(!bySize.has(f.size)) bySize.set(f.size, []);
      bySize.get(f.size).push(f);
    });
    let todo = [];
    bySize.forEach(list=>{ if(list.length > 1) todo = todo.concat(list); });
    if(!all) todo = todo.filter(f=>!f.sha);
    todo = todo.filter(f=>f.size < 600e6);
    if(!todo.length){ Toast.ok('Nothing new to hash'); return 0; }

    Prog.start('Hashing '+todo.length+' candidate files...');
    let n = 0;
    const dirty = [];
    for(let i=0;i<todo.length;i++){
      if(Prog.cancelled) break;
      const f = todo[i];
      Prog.set('Hashing ('+(i+1)+'/'+todo.length+') '+f.name, i, todo.length);
      try{
        const buf = await (await FS.read(f.rootId, f.path)).arrayBuffer();
        const out = await Work.call({op:'hash', buf}, [buf]);
        f.sha = out.sha; dirty.push(f); n++;
      }catch(e){ /* unreadable */ }
      if(dirty.length >= 200){ await DB.putMany('files', dirty.splice(0)); }
    }
    if(dirty.length) await DB.putMany('files', dirty);
    Prog.stop();
    return n;
  },

  async removeRoot(rootId){
    const r = Store.root(rootId); if(!r) return;
    const fileIds = Store.files.filter(f=>f.rootId===rootId).map(f=>f.id);
    const modelIds = Store.models.filter(m=>m.rootId===rootId).map(m=>m.id);
    await DB.delMany('files', fileIds);
    await DB.delMany('models', modelIds);
    for(const m of modelIds) await Thumbs.del('tm'+m);
    await Store.remove('roots', rootId);
    Store.files = Store.files.filter(f=>f.rootId!==rootId);
    Store.models = Store.models.filter(m=>m.rootId!==rootId);
    Store.reindex();
    Toast.ok('Removed "'+r.name+'" from the library');
    UI.render();
  }
};

/* ============================================================
   UI — shell, tabs, sidebar, routing
   ============================================================ */
const TABS = [
  {id:'library',  label:'Library',  icon:'cube',  count:()=>Store.models.length},
  {id:'prints',   label:'Prints',   icon:'print', count:()=>Store.prints.length},
  {id:'filament', label:'Filament', icon:'spool', count:()=>Store.filaments.length},
  {id:'queue',    label:'Queue',    icon:'queue', count:()=>Store.queue.filter(q=>q.status!=='done').length},
  {id:'dupes',    label:'Duplicates', icon:'copy', count:()=>null},
  {id:'stats',    label:'Stats',    icon:'chart', count:()=>null},
  {id:'settings', label:'Settings', icon:'gear',  count:()=>null}
];

const UI = {
  tab:'library',
  filter:{rootId:'', tag:'', coll:'', quick:'', q:''},
  page:1,
  PAGE:120,

  go(tab){
    UI.tab = tab; UI.page = 1;
    document.querySelectorAll('.pv-view').forEach(v=>v.classList.toggle('on', v.id === 'v'+'-'+tab));
    location.hash = tab;
    UI.render();
    document.getElementById('main').scrollTop = 0;
  },

  render(){
    UI.renderTabs();
    UI.renderSide();
    const v = document.getElementById('v-'+UI.tab);
    if(!v) return;
    ({
      library:  ()=>Library.render(v),
      prints:   ()=>Prints.render(v),
      filament: ()=>Filament.render(v),
      queue:    ()=>Queue.render(v),
      dupes:    ()=>Dupes.render(v),
      stats:    ()=>Stats.render(v),
      settings: ()=>Settings.render(v)
    })[UI.tab]();
    Thumbs.hydrate(v);
  },

  renderTabs(){
    document.getElementById('tabs').innerHTML = TABS.map(t=>{
      const c = t.count();
      return '<button class="pv-tab'+(UI.tab===t.id?' on':'')+'" onclick="PV.UI.go(\''+t.id+'\')">'+I[t.icon]+
             '<span>'+t.label+'</span>'+(c ? '<span class="ct">'+(c>999?'999+':c)+'</span>' : '')+'</button>';
    }).join('');
  },

  renderSide(){
    const side = document.getElementById('side');
    side.classList.toggle('hide', !Store.settings.sidebar || UI.tab !== 'library');
    if(UI.tab !== 'library') return;
    const f = UI.filter;
    const models = Store.models;
    const printed = new Set(Store.prints.map(p=>p.modelId));
    const q = {
      fav: models.filter(m=>m.favorite).length,
      unprinted: models.filter(m=>!printed.has(m.id)).length,
      printed: models.filter(m=>printed.has(m.id)).length,
      gcode: models.filter(m=>m.gcodeCount > 0).length,
      untagged: models.filter(m=>!(m.tags||[]).length).length,
      nothumb: models.filter(m=>!m.thumbId).length,
      arch: models.filter(m=>m.isArchive).length
    };
    const item = (on, icon, name, count, click, extra)=>
      '<button class="pv-si'+(on?' on':'')+'" onclick="'+click+'">'+(icon?I[icon]:'')+
      '<span class="n">'+U.esc(name)+'</span>'+(count!=null?'<span class="c">'+count+'</span>':'')+(extra||'')+'</button>';

    let h = '<div class="pv-sg">'+
      '<div class="pv-sh">Library</div>'+
      item(!f.quick && !f.rootId && !f.tag && !f.coll, 'cube', 'All models', models.length, "PV.Library.filter('reset')")+
      item(f.quick==='fav', 'star', 'Favorites', q.fav, "PV.Library.filter('quick','fav')")+
      item(f.quick==='unprinted', 'clock', 'Never printed', q.unprinted, "PV.Library.filter('quick','unprinted')")+
      item(f.quick==='printed', 'check', 'Printed', q.printed, "PV.Library.filter('quick','printed')")+
      item(f.quick==='gcode', 'print', 'Sliced (gcode)', q.gcode, "PV.Library.filter('quick','gcode')")+
      (q.arch ? item(f.quick==='arch', 'copy', 'Archives', q.arch, "PV.Library.filter('quick','arch')") : '')+
      item(f.quick==='untagged', 'tag', 'Untagged', q.untagged, "PV.Library.filter('quick','untagged')")+
      item(f.quick==='nothumb', 'img', 'No preview', q.nothumb, "PV.Library.filter('quick','nothumb')")+
      '</div>';

    h += '<div class="pv-sg"><div class="pv-sh">Folders<button onclick="PV.Scan.addRoot()" title="Add folder">'+I.plus+'</button></div>';
    if(!Store.roots.length) h += '<div style="padding:6px 14px;color:var(--dim2);font-size:12px">No folders indexed</div>';
    Store.roots.forEach(r=>{
      h += '<div class="pv-root">'+item(f.rootId===r.id, 'folder', r.name, r.models||0,
        "PV.Library.filter('root','"+r.id+"')",
        '<span class="x" onclick="event.stopPropagation();PV.Library.rootMenu(\''+r.id+'\')" title="Folder options">'+I.gear+'</span>')+'</div>';
    });
    h += '</div>';

    const colls = Store.allCollections();
    if(colls.length){
      h += '<div class="pv-sg"><div class="pv-sh">Collections</div>';
      colls.forEach(([c,n])=>{ h += item(f.coll===c, 'folder', c, n, "PV.Library.filter('coll',"+JSON.stringify(c).replace(/"/g,'&quot;')+")"); });
      h += '</div>';
    }

    const tags = Store.allTags();
    if(tags.length){
      const show = UI._allTags ? tags : tags.slice(0, 18);
      h += '<div class="pv-sg"><div class="pv-sh">Tags</div>';
      show.forEach(([t,n])=>{ h += item(f.tag===t, 'tag', t, n, "PV.Library.filter('tag',"+JSON.stringify(t).replace(/"/g,'&quot;')+")"); });
      if(tags.length > 18) h += '<button class="pv-si" onclick="PV.UI.toggleTags()"><span class="n" style="color:var(--acc)">'+
        (UI._allTags ? 'Show fewer' : 'Show all '+tags.length+' tags')+'</span></button>';
      h += '</div>';
    }
    side.innerHTML = h;
  },
  toggleTags(){ UI._allTags = !UI._allTags; UI.renderSide(); }
};

/* ============================================================
   Library
   ============================================================ */
const Library = {
  sel:new Set(),

  filter(kind, val){
    const f = UI.filter;
    if(kind==='reset'){ f.rootId=''; f.tag=''; f.coll=''; f.quick=''; }
    else if(kind==='root'){ f.rootId = f.rootId===val ? '' : val; }
    else if(kind==='tag'){ f.tag = f.tag===val ? '' : val; f.quick=''; }
    else if(kind==='coll'){ f.coll = f.coll===val ? '' : val; f.quick=''; }
    else if(kind==='quick'){ f.quick = f.quick===val ? '' : val; }
    UI.page = 1; Library.sel.clear(); UI.render();
  },

  list(){
    const f = UI.filter, s = Store.settings;
    const toks = U.tokens(f.q);
    const printed = new Set(Store.prints.map(p=>p.modelId));
    let out = Store.models.filter(m=>{
      if(f.rootId && m.rootId !== f.rootId) return false;
      if(f.tag && !(m.tags||[]).includes(f.tag)) return false;
      if(f.coll && !(m.collections||[]).includes(f.coll)) return false;
      if(f.quick==='fav' && !m.favorite) return false;
      if(f.quick==='unprinted' && printed.has(m.id)) return false;
      if(f.quick==='printed' && !printed.has(m.id)) return false;
      if(f.quick==='gcode' && !m.gcodeCount) return false;
      if(f.quick==='arch' && !m.isArchive) return false;
      if(f.quick==='untagged' && (m.tags||[]).length) return false;
      if(f.quick==='nothumb' && m.thumbId) return false;
      if(toks.length){
        const hay = m.name+' '+m.path+' '+(m.tags||[]).join(' ')+' '+(m.collections||[]).join(' ')+' '+
                    (m.creator||'')+' '+(m.notes||'')+' '+(m.source||'')+' '+((m.inner||[]).join(' '));
        if(!U.match(hay, toks)) return false;
      }
      return true;
    });
    const lastPrint = new Map();
    Store.prints.forEach(p=>{ const t = lastPrint.get(p.modelId); if(!t || p.date > t) lastPrint.set(p.modelId, p.date); });
    const keys = {
      name: m=>m.name.toLowerCase(),
      recent: m=>m.mtime||0,
      added: m=>m.createdAt||0,
      size: m=>m.bytes||0,
      files: m=>m.fileCount||0,
      printed: m=>lastPrint.get(m.id)||'',
      rating: m=>m.rating||0,
      time: m=>(m.est && m.est.timeMin)||0
    };
    return U.sortBy(out, keys[s.sort]||keys.name, s.dir);
  },

    if(f.coll) crumbs.push(['Collection', f.coll, "PV.Library.filter('coll',"+JSON.stringify(f.coll).replace(/"/g,'&quot;')+")"]);
    if(f.quick) crumbs.push(['View', f.quick, "PV.Library.filter('quick','"+f.quick+"')"]);

      '<div class="sp"></div>'+

        '<button class="'+(s.view==='grid'?'on':'')+'" onclick="PV.Library.setView(\'grid\')" title="Grid">'+I.grid+'</button>'+

      '</div>'+
      '<select class="b sm" style="padding-right:8px" onchange="PV.Library.setSort(this.value)">'+
        [['name','Name'],['recent','File date'],['added','Date added'],['size','Size'],['files','File count'],
         ['printed','Last printed'],['rating','Rating'],['time','Print time']]
        .map(o=>'<option value="'+o[0]+'"'+(s.sort===o[0]?' selected':'')+'>Sort: '+o[1]+'</option>').join('')+
