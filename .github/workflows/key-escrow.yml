# Get the update signing key back out of GitHub.
#
# TAURI_SIGNING_PRIVATE_KEY was set on 2026-07-29 and exists nowhere else: not
# on the build machine, not in a password manager, not in any other repo. GitHub
# secrets are write-only, so a workflow is the only thing that can read it. If
# it is ever lost, every installed copy of PrintVault stops being able to accept
# an update forever, because the public half is compiled into each one and a new
# keypair signs things they will refuse.
#
# This repo is PUBLIC. Workflow logs and artifacts on a public repo can be read
# by anyone, so this never prints the key: it encrypts it inside the runner and
# uploads only the ciphertext. That ciphertext is public from the moment it is
# written, and it is worth exactly what the passphrase is worth. Use a long one
# that exists nowhere else.
#
# How to use it, once:
#   1. Add a repo secret KEY_BACKUP_PASSPHRASE. Long, random, kept somewhere you
#      will still have in three years.
#   2. Run this workflow by hand. It has no triggers other than that.
#   3. Download the artifact and decrypt it locally:
#        openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in key.enc -out key.txt
#      Check it is the right key before trusting it. The first eight bytes after
#      the algorithm in the public half are the key id, 0e4c7a98f2f7edfc, and the
#      recovered private key carries the same id.
#   4. Put key.txt where you will still have it, delete the local copy, delete
#      the artifact, delete KEY_BACKUP_PASSPHRASE, and delete this workflow.
#
# Step 4 is not tidying. An escrow path left switched on is a second way to lose
# the key, and the artifact sitting in a public repo is the first.

name: Escrow signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  escrow:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt the key inside the runner
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.KEY_BACKUP_PASSPHRASE }}
        run: |
          set -eu
          # No echo, no cat, no set -x anywhere in this job. GitHub masks secrets
          # in logs, but masking is a safety net and not a plan: it is defeated
          # by anything that transforms the value before printing it.
          test -n "${KEY:-}" || { echo "TAURI_SIGNING_PRIVATE_KEY is not set on this repo"; exit 1; }
          test -n "${PASS:-}" || { echo "KEY_BACKUP_PASSPHRASE is not set; add it first"; exit 1; }
          printf '%s' "$KEY" > key.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in key.txt -out key.enc -pass env:PASS
          # Sanity, without revealing anything: the plaintext should look like a
          # minisign secret key and the ciphertext should be bigger than nothing.
          echo "plaintext  $(wc -c < key.txt) bytes"
          echo "ciphertext $(wc -c < key.enc) bytes"
          shred -u key.txt 2>/dev/null || rm -f key.txt

      - name: Upload the ciphertext
        uses: actions/upload-artifact@v4
        with:
          name: signing-key-escrow
          path: key.enc
          retention-days: 1
          if-no-files-found: error
