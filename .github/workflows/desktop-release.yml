# Builds the PrintVault desktop app (Tauri) for macOS, Linux and Windows.
#
# Tauri can't cross-compile, so each installer is produced on its own OS runner.
# There is no frontend build step: desktop/build.mjs copies the single-file app
# from index.html into desktop/dist and stamps the version into the shell.
#
# Trigger:
#   - push a tag matching desktop-v*   (e.g. desktop-v0.2.0)  -> release build
#   - or run manually from the Actions tab (workflow_dispatch)
#
# Output: a DRAFT GitHub Release named "PrintVault Desktop v<version>" with the
# .dmg (macOS, universal), .AppImage/.deb (Linux) and .msi/.exe (Windows).
# Review the draft and hit Publish when you're happy with it.

name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon; builds a universal binary
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04 # older base = wider AppImage compatibility
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds a universal binary, so it needs both arch targets.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # Icons are generated from raw pixels rather than committed as binaries,
      # so they are reproducible and there is nothing to keep in sync by hand.
      - name: Generate icons
        working-directory: desktop
        run: node make-icon.mjs

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: desktop-v__VERSION__
          releaseName: "PrintVault Desktop v__VERSION__"
          releaseDraft: true
          prerelease: false
